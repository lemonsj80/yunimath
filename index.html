// 구버전 mids[mid].bookSubs[book] → 신버전 bookMids[book][mid] 자동 마이그레이션
function migrateCurriculum(cur){
  const next=JSON.parse(JSON.stringify(cur));
  Object.values(next).forEach(grade=>{
    Object.values(grade.chapters||{}).forEach(ch=>{
      if(ch.mids&&!ch.bookMids){
        ch.bookMids={};
        Object.entries(ch.mids).forEach(([mid,midData])=>{
          Object.entries(midData.bookSubs||{}).forEach(([book,subs])=>{
            if(!ch.bookMids[book])ch.bookMids[book]={};
            ch.bookMids[book][mid]=subs||[];
          });
        });
        delete ch.mids;
      }
      if(!ch.bookMids)ch.bookMids={};
    });
  });
  return next;
}

async function saveCurriculum(cur,order){
  if(!window.__fbReady)return;
  try{const{doc,setDoc}=window.__fb;await setDoc(doc(window.__db,"settings","curriculum"),{data:JSON.stringify(cur),order:JSON.stringify(order||Object.keys(cur))});}
  catch(e){console.error(e);}
}
async function loadCurriculum(){
  if(!window.__fbReady)return null;
  try{const{doc,getDoc}=window.__fb;const snap=await getDoc(doc(window.__db,"settings","curriculum"));if(snap.exists()){const d=snap.data();return{cur:migrateCurriculum(JSON.parse(d.data)),order:d.order?JSON.parse(d.order):null};}}
  catch(e){console.error(e);}
  return null;
}

let __cropperInstance=null;
function openCropModal(file, cb){
  const modal=document.getElementById("crop-modal");
  const cropImg=document.getElementById("crop-img");
  const reader=new FileReader();
  reader.onload=e=>{
    cropImg.src=e.target.result;
    modal.style.display="flex";
    if(__cropperInstance){__cropperInstance.destroy();__cropperInstance=null;}
    cropImg.onload=()=>{
      __cropperInstance=new Cropper(cropImg,{
        viewMode:1,
        autoCropArea:0.9,
        movable:true,
        zoomable:true,
        rotatable:false,
        scalable:false,
        responsive:true,
      });
    };
    document.getElementById("crop-confirm-btn").onclick=()=>{
      const canvas=__cropperInstance.getCroppedCanvas({maxWidth:800,maxHeight:800});
      const result=canvas.toDataURL("image/jpeg",0.65);
      modal.style.display="none";
      __cropperInstance.destroy();__cropperInstance=null;
      cb(result);
    };
    document.getElementById("crop-cancel-btn").onclick=()=>{
      modal.style.display="none";
      if(__cropperInstance){__cropperInstance.destroy();__cropperInstance=null;}
    };
  };
  reader.readAsDataURL(file);
}

function compressImage(file,cb){
  const reader=new FileReader();
  reader.onload=e=>{const img=new Image();img.onload=()=>{const canvas=document.createElement("canvas");let w=img.width,h=img.height;if(w>800){h=Math.round(h*800/w);w=800;}canvas.width=w;canvas.height=h;canvas.getContext("2d").drawImage(img,0,0,w,h);cb(canvas.toDataURL("image/jpeg",0.65));};img.src=e.target.result;};
  reader.readAsDataURL(file);
}

    <div ref={ref} style={{position:"relative",width:"100%"}}>
      {label&&<div style={{fontSize:12,color:C.sub,marginBottom:4}}>{label}</div>}
      <div onClick={()=>setOpen(o=>!o)} style={{width:"100%",borderRadius:10,border:`1.5px solid ${open?C.a1:C.br}`,padding:"9px 12px",fontSize:13,background:"#fff",color:C.tx,cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}}>

function buildPrintHTML(cards){
  const pages=[];
  for(let i=0;i<cards.length;i+=4)pages.push(cards.slice(i,i+4));
  return pages.map((pc,pi)=>{
    const slots=Array(4).fill(null).map((_,i)=>pc[i]||null);
    const ch=slots.map(card=>{
      if(!card)return`<div style="border:1.5px dashed #e0e0e0;border-radius:6px;background:#fafafa;"></div>`;
      const mt=MT.find(m=>m.id===card.mistakeType)||MT[0];
      const dc={A:["#b5e0f7","#4a9fc0"],B:["#d4efc0","#5a9a40"],C:["#f4d0e8","#c05080"]}[card.difficulty]||["#eee","#888"];
      return`<div class="print-card"><div class="print-card-meta"><span class="print-badge" style="background:#f0eaf8;color:#5e3f9a;">${card.grade}</span><span class="print-badge" style="background:#ede5f8;color:#7c5cb8;">${card.book}</span>${card.bigChapter?`<span class="print-badge" style="background:#f0f0f0;color:#666;">${card.bigChapter}</span>`:""} ${card.midChapter?`<span class="print-badge" style="background:#f5f5f5;color:#888;">${card.midChapter}</span>`:""} ${card.subChapter?`<span class="print-badge" style="background:#f9f9f9;color:#aaa;">${card.subChapter}</span>`:""}<span class="print-badge" style="background:${dc[0]};color:${dc[1]};">${card.difficulty}단계</span><span class="print-badge" style="background:${mt.bg};color:${mt.color};border:1px solid ${mt.color};">${mt.label}</span></div><div style="flex:1;display:flex;align-items:flex-start;justify-content:center;overflow:hidden;padding-top:3px;"><img src="${card.img}" style="max-width:100%;object-fit:contain;border-radius:4px;"/></div>${card.memo?`<div class="print-memo">📝 ${card.memo}</div>`:""}<div class="print-num">${cards.indexOf(card)+1}번 · ${card.date}</div></div>`;
    }).join("");
    const hdr=pi===0?`<div style="grid-column:1/-1;border-bottom:1.5px solid #9b7fd4;padding-bottom:3px;display:flex;align-items:center;gap:8px;"><span style="font-size:11px;font-weight:900;color:#2d1f4a;">🌱 수학 오답 노트</span><span style="font-size:8px;color:#9a8ab0;">총 ${cards.length}문제 · ${new Date().toLocaleDateString("ko-KR")} 출력</span></div>`:`<div style="grid-column:1/-1;height:0;overflow:hidden;padding:0;margin:0;border:none;"></div>`;
    return`<div class="print-page">${hdr}${ch}</div>`;
  }).join("");
}

function doPrint(cards){
  if(!cards.length){alert("프린트할 문제가 없어요!");return;}
  const area=document.getElementById("print-area");
  const isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  area.innerHTML=buildPrintHTML(cards);
  if(!isMobile){
    window.print();
    return;
  }
  // 모바일: 이미지로 저장
  area.style.display="block";
  const today=new Date().toLocaleDateString("ko-KR").replace(/\. /g,"").replace(/\./g,"");
  html2canvas(area,{backgroundColor:"#ffffff",scale:1.5,useCORS:true,logging:false}).then(canvas=>{
    area.style.display="none";
    canvas.toBlob(blob=>{
      if(!blob){alert("이미지 생성 실패");return;}
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a");
      a.href=url;a.download="오답노트_"+today+".png";
      document.body.appendChild(a);a.click();document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url),3000);
    },"image/png");
  }).catch(e=>{area.style.display="none";alert("저장 실패: "+e.message);});
}


function Add({onAdd,onCancel,curriculum,gradeOrder}){
  const grades=gradeOrder.filter(g=>curriculum[g]);
  const[img,setImg]=useState(null);const[ai,setAi]=useState(null);const[at,setAt]=useState("");const[memo,setMemo]=useState("");
  const[mt,setMt]=useState("wrong");const[dif,setDif]=useState("B");
  const getBooks=g=>curriculum[g]?.books||[];
  const getBigs=g=>Object.keys(curriculum[g]?.chapters||{});
  const getMids=(g,big,book)=>Object.keys(curriculum[g]?.chapters?.[big]?.bookMids?.[book]||{});
  const getSubs=(g,big,mid,book)=>curriculum[g]?.chapters?.[big]?.bookMids?.[book]?.[mid]||[];

  const lastGr=localStorage.getItem("yuni_last_gr");
  const initGr=(lastGr&&grades.includes(lastGr))?lastGr:(grades[0]||"");
  const lastBk=localStorage.getItem("yuni_last_bk");
  const initBk=(lastBk&&getBooks(initGr).includes(lastBk))?lastBk:(getBooks(initGr)[0]||"");

  const[gr,setGr]=useState(initGr);
  const[bk,setBk]=useState(initBk);
  const lastBig=localStorage.getItem("yuni_last_big");
  const initBig=(lastBig&&getBigs(initGr).includes(lastBig))?lastBig:(getBigs(initGr)[0]||"");
  const lastMid=localStorage.getItem("yuni_last_mid");
  const initMid=(lastMid&&getMids(initGr,initBig,initBk).includes(lastMid))?lastMid:(getMids(initGr,initBig,initBk)[0]||"");
  const lastSub=localStorage.getItem("yuni_last_sub");
  const initSub=(lastSub&&getSubs(initGr,initBig,initMid,initBk).includes(lastSub))?lastSub:(getSubs(initGr,initBig,initMid,initBk)[0]||"");
  const[bigCh,setBigCh]=useState(initBig);
  const[midCh,setMidCh]=useState(initMid);
  const[subCh,setSubCh]=useState(initSub);
  const[saving,setSaving]=useState(false);
  const fr=useRef();const ar=useRef();const fcam=useRef();

  useEffect(()=>{
    const mids=getMids(gr,bigCh,bk);const m=mids[0]||"";setMidCh(m);localStorage.setItem("yuni_last_mid",m);
    const s=getSubs(gr,bigCh,m,bk)[0]||"";setSubCh(s);localStorage.setItem("yuni_last_sub",s);
  },[gr,bigCh,bk]);
  useEffect(()=>{const s=getSubs(gr,bigCh,midCh,bk)[0]||"";setSubCh(s);localStorage.setItem("yuni_last_mid",midCh);localStorage.setItem("yuni_last_sub",s);},[midCh]);

function CurriculumManager({curriculum,gradeOrder,onSave}){
  const[newGrade,setNewGrade]=useState("");
  const[expandedGrade,setExpandedGrade]=useState(null);
  const[newBook,setNewBook]=useState({});
  const[newBig,setNewBig]=useState({});
  const[expandedBig,setExpandedBig]=useState({});
  const[selBookTab,setSelBookTab]=useState({});// key: grade__big → book
  const[newMid,setNewMid]=useState({});// key: grade__big__book → string
  const[expandedMid,setExpandedMid]=useState({});
  const[newSub,setNewSub]=useState({});// key: grade__big__book__mid → string
  const[confirmDel,setConfirmDel]=useState(null);
  const[confirmDelBook,setConfirmDelBook]=useState(null);
  const[editBigKey,setEditBigKey]=useState(null);
  const[editBigVal,setEditBigVal]=useState("");
  const[editMidKey,setEditMidKey]=useState(null);
  const[editMidVal,setEditMidVal]=useState("");
  const[editSubKey,setEditSubKey]=useState(null);
  const[editSubVal,setEditSubVal]=useState("");

  const save=(nextCur,nextOrder)=>{onSave(nextCur,nextOrder||gradeOrder);};

  const moveGrade=(grade,dir)=>{
    const ord=[...gradeOrder];const i=ord.indexOf(grade);const j=i+dir;
    if(j<0||j>=ord.length)return;[ord[i],ord[j]]=[ord[j],ord[i]];onSave(curriculum,ord);
  };
  const addGrade=()=>{
    const g=newGrade.trim();if(!g)return;
    if(curriculum[g])return alert("이미 있는 학기예요!");
    save({...curriculum,[g]:{books:[],chapters:{}}},[...gradeOrder,g]);
    setNewGrade("");setExpandedGrade(g);
  };
  const delGrade=g=>{
    if(confirmDel===g){const next={...curriculum};delete next[g];save(next,gradeOrder.filter(k=>k!==g));setConfirmDel(null);}
    else setConfirmDel(g);
  };
  const addBook=grade=>{
    const b=(newBook[grade]||"").trim();if(!b)return;
    if((curriculum[grade].books||[]).includes(b))return alert("이미 있는 교재예요!");
    save({...curriculum,[grade]:{...curriculum[grade],books:[...curriculum[grade].books,b]}});
    setNewBook(p=>({...p,[grade]:""}));
  };
  const delBook=(grade,book)=>{
    const key=grade+"__"+book;
    if(confirmDelBook===key){save({...curriculum,[grade]:{...curriculum[grade],books:curriculum[grade].books.filter(b=>b!==book)}});setConfirmDelBook(null);}
    else setConfirmDelBook(key);
  };

  const addBig=grade=>{
    const b=(newBig[grade]||"").trim();if(!b)return;
    if(curriculum[grade].chapters[b])return alert("이미 있는 대단원이에요!");
    save({...curriculum,[grade]:{...curriculum[grade],chapters:{...curriculum[grade].chapters,[b]:{bookMids:{}}}}});
    setNewBig(p=>({...p,[grade]:""}));setExpandedBig(p=>({...p,[grade+"__"+b]:true}));
  };
  const delBig=(grade,big)=>{
    if(!window.confirm(`"${big}" 대단원을 삭제할까요?`))return;
    const next={...curriculum};const chs={...next[grade].chapters};delete chs[big];next[grade]={...next[grade],chapters:chs};save(next);
  };

  // 중단원 추가 (교재별)
  const addMid=(grade,big,book)=>{
    const key=grade+"__"+big+"__"+book;
    const m=(newMid[key]||"").trim();if(!m)return;
    const bm=curriculum[grade]?.chapters?.[big]?.bookMids||{};
    if((bm[book]||{})[m]!==undefined)return alert("이미 있는 중단원이에요!");
    const updBm={...bm,[book]:{...(bm[book]||{}),[m]:[]}};
    const next={...curriculum,[grade]:{...curriculum[grade],chapters:{...curriculum[grade].chapters,[big]:{bookMids:updBm}}}};
    save(next);setNewMid(p=>({...p,[key]:""}));
    setExpandedMid(p=>({...p,[grade+"__"+big+"__"+book+"__"+m]:true}));
  };
  const delMid=(grade,big,book,mid)=>{
    if(!window.confirm(`"${mid}" 중단원을 삭제할까요?`))return;
    const bm=JSON.parse(JSON.stringify(curriculum[grade]?.chapters?.[big]?.bookMids||{}));
    delete bm[book][mid];
    save({...curriculum,[grade]:{...curriculum[grade],chapters:{...curriculum[grade].chapters,[big]:{bookMids:bm}}}});
  };

  // 소단원 추가/삭제/수정
  const addSub=(grade,big,book,mid)=>{
    const key=grade+"__"+big+"__"+book+"__"+mid;
    const s=(newSub[key]||"").trim();if(!s)return;
    const bm=JSON.parse(JSON.stringify(curriculum[grade]?.chapters?.[big]?.bookMids||{}));
    const subs=bm[book][mid]||[];
    if(subs.includes(s))return alert("이미 있는 소단원이에요!");
    bm[book][mid]=[...subs,s];
    save({...curriculum,[grade]:{...curriculum[grade],chapters:{...curriculum[grade].chapters,[big]:{bookMids:bm}}}});
    setNewSub(p=>({...p,[key]:""}));
  };
  const delSub=(grade,big,book,mid,sub)=>{
    const bm=JSON.parse(JSON.stringify(curriculum[grade]?.chapters?.[big]?.bookMids||{}));
    bm[book][mid]=(bm[book][mid]||[]).filter(s=>s!==sub);
    save({...curriculum,[grade]:{...curriculum[grade],chapters:{...curriculum[grade].chapters,[big]:{bookMids:bm}}}});
  };
  const renameSub=(grade,big,book,mid,si,newName)=>{
    const trimmed=newName.trim();if(!trimmed)return;
    const bm=JSON.parse(JSON.stringify(curriculum[grade]?.chapters?.[big]?.bookMids||{}));
    bm[book][mid][si]=trimmed;
    save({...curriculum,[grade]:{...curriculum[grade],chapters:{...curriculum[grade].chapters,[big]:{bookMids:bm}}}});
    setEditSubKey(null);setEditSubVal("");
  };
  const renameBig=(grade,oldBig,newName)=>{
    const trimmed=newName.trim();if(!trimmed||trimmed===oldBig){setEditBigKey(null);setEditBigVal("");return;}
    if(curriculum[grade].chapters[trimmed])return alert("이미 있는 대단원이에요!");
    const oldChs=curriculum[grade].chapters;const newChs={};
    Object.keys(oldChs).forEach(k=>{newChs[k===oldBig?trimmed:k]=oldChs[k];});
    save({...curriculum,[grade]:{...curriculum[grade],chapters:newChs}});
    setEditBigKey(null);setEditBigVal("");
  };
  const renameMid=(grade,big,book,oldMid,newName)=>{
    const trimmed=newName.trim();if(!trimmed||trimmed===oldMid){setEditMidKey(null);setEditMidVal("");return;}
    const bm=JSON.parse(JSON.stringify(curriculum[grade]?.chapters?.[big]?.bookMids||{}));
    if(bm[book][trimmed]!==undefined)return alert("이미 있는 중단원이에요!");
    const nb={};Object.keys(bm[book]).forEach(k=>{nb[k===oldMid?trimmed:k]=bm[book][k];});bm[book]=nb;
    save({...curriculum,[grade]:{...curriculum[grade],chapters:{...curriculum[grade].chapters,[big]:{bookMids:bm}}}});
    setEditMidKey(null);setEditMidVal("");
  };

  const iStyle={flex:1,borderRadius:8,border:`1.5px solid ${C.br}`,padding:"7px 10px",fontSize:12,color:C.tx,background:"#fff"};
  const btnAdd={borderRadius:8,border:`1.5px solid ${C.a1}`,background:"#fff",color:C.a2,padding:"7px 12px",fontSize:12,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"};

  return(
    <div style={{paddingBottom:40}}>
      {/* 학기 추가 */}
      <div style={{background:"#fff",borderRadius:14,padding:14,border:`1.5px solid ${C.br}`,marginBottom:14,boxShadow:"0 2px 8px rgba(155,127,212,.06)"}}>
        <div style={{fontSize:12,fontWeight:700,color:C.sub,marginBottom:8}}>학기 추가</div>
        <div style={{display:"flex",gap:8}}>
          <input value={newGrade} onChange={e=>setNewGrade(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addGrade()} placeholder="예: 중1-1, 고1" style={iStyle}/>
          <button onClick={addGrade} style={{...btnAdd,background:`linear-gradient(135deg,${C.a1},${C.a2})`,color:"#fff",border:"none"}}>추가</button>
        </div>
      </div>

      {gradeOrder.filter(g=>curriculum[g]).map((grade,gi)=>{
        const isExp=expandedGrade===grade;
        const bks=curriculum[grade].books||[];
        const chs=curriculum[grade].chapters||{};
        return(
          <div key={grade} style={{background:"#fff",borderRadius:14,border:`1.5px solid ${C.br}`,marginBottom:10,overflow:"hidden",boxShadow:"0 2px 8px rgba(155,127,212,.06)"}}>
            <div style={{padding:"12px 14px",display:"flex",alignItems:"center",gap:10,cursor:"pointer",background:isExp?C.hd:"#fff"}} onClick={()=>setExpandedGrade(isExp?null:grade)}>
              <span style={{fontSize:11,color:C.a1}}>{isExp?"▼":"▶"}</span>
              <div style={{flex:1}}>
                <div style={{fontSize:14,fontWeight:700,color:C.tx}}>{grade}</div>
                <div style={{fontSize:10,color:C.sub,marginTop:1}}>{bks.length}개 교재 · {Object.keys(chs).length}개 대단원</div>
              </div>
              <div style={{display:"flex",gap:4,alignItems:"center"}} onClick={e=>e.stopPropagation()}>
                <button onClick={()=>moveGrade(grade,-1)} disabled={gi===0} style={{borderRadius:6,border:`1px solid ${C.br}`,background:"#fff",color:gi===0?"#ddd":C.sub,padding:"3px 7px",fontSize:12,cursor:gi===0?"default":"pointer"}}>▲</button>
                <button onClick={()=>moveGrade(grade,1)} disabled={gi===gradeOrder.length-1} style={{borderRadius:6,border:`1px solid ${C.br}`,background:"#fff",color:gi===gradeOrder.length-1?"#ddd":C.sub,padding:"3px 7px",fontSize:12,cursor:gi===gradeOrder.length-1?"default":"pointer"}}>▼</button>
                <button onClick={()=>delGrade(grade)} style={{borderRadius:8,border:`1px solid ${confirmDel===grade?"#e07a7a":C.br}`,background:confirmDel===grade?"#fdeaea":"#fff",color:confirmDel===grade?"#e07a7a":C.sub,padding:"4px 10px",fontSize:11,cursor:"pointer",fontWeight:700}}>
                  {confirmDel===grade?"정말 삭제?":"삭제"}
                </button>
              </div>
            </div>

            {isExp&&<div style={{borderTop:`1px solid ${C.br}`,padding:14}}>
              {/* 교재 목록 */}
              <div style={{marginBottom:16}}>
                <div style={{fontSize:12,fontWeight:700,color:C.sub,marginBottom:8}}>📚 교재 목록</div>
                <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:8}}>
                  {bks.map(b=>{const dKey=grade+"__"+b;const isDel=confirmDelBook===dKey;return(
                    <div key={b} style={{display:"flex",alignItems:"center",gap:5,background:isDel?"#fdeaea":C.hd,borderRadius:20,padding:"4px 6px 4px 12px",border:`1.5px solid ${isDel?"#e07a7a":C.br}`,transition:"all 0.15s"}}>
                      <span style={{fontSize:12,color:isDel?"#e07a7a":C.a2,fontWeight:600}}>{b}</span>
                      {isDel
                        ?<><button onClick={()=>delBook(grade,b)} style={{background:"#e07a7a",border:"none",color:"#fff",borderRadius:12,padding:"3px 9px",fontSize:10,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>삭제확인</button>
                          <button onClick={()=>setConfirmDelBook(null)} style={{background:"none",border:"none",color:C.sub,cursor:"pointer",fontSize:14,padding:"0 4px"}}>✕</button></>
                        :<button onClick={()=>setConfirmDelBook(dKey)} style={{background:"none",border:"none",color:"#bbb",cursor:"pointer",fontSize:16,lineHeight:1,padding:"0 4px"}}>×</button>
                      }
                    </div>
                  );})}
                </div>
                <div style={{display:"flex",gap:8}}>
                  <input value={newBook[grade]||""} onChange={e=>setNewBook(p=>({...p,[grade]:e.target.value}))} onKeyDown={e=>e.key==="Enter"&&addBook(grade)} placeholder="교재명 입력" style={iStyle}/>
                  <button onClick={()=>addBook(grade)} style={btnAdd}>+ 추가</button>
                </div>
              </div>

              {/* 단원 구성 */}
              <div>
                <div style={{fontSize:12,fontWeight:700,color:C.sub,marginBottom:8}}>📖 단원 구성</div>
                {bks.length>0&&<div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center",marginBottom:12,padding:"8px 12px",background:"#f4f0f8",borderRadius:10,border:`1px solid ${C.br}`}}>
                  <span style={{fontSize:11,fontWeight:700,color:C.sub,marginRight:2,flexShrink:0}}>📚 교재:</span>
                  {bks.map(b=>{const sb=selBookTab[grade]||(bks[0]||"");return(
                    <button key={b} onClick={()=>setSelBookTab(p=>({...p,[grade]:b}))}
                      style={{borderRadius:20,border:`1.5px solid ${sb===b?C.a1:C.br}`,background:sb===b?`linear-gradient(135deg,${C.a1},${C.a2})`:"#fff",color:sb===b?"#fff":C.sub,padding:"4px 14px",fontSize:12,fontWeight:700,cursor:"pointer",flexShrink:0}}>
                      {b}
                    </button>
                  );})}
                </div>}
                {Object.keys(chs).map(big=>{
                  const bigExpKey=grade+"__"+big;
                  const isBigExp=expandedBig[bigExpKey]!==false;
                  const bookMids=chs[big]?.bookMids||{};
                  const selBook=selBookTab[grade]||(bks[0]||"");
                  const midsForBook=bookMids[selBook]||{};
                  const midKeys=Object.keys(midsForBook);

                  return(
                    <div key={big} style={{borderRadius:10,border:`1px solid ${C.br}`,marginBottom:8,overflow:"hidden",background:"#faf8fc"}}>
                      {/* 대단원 헤더 */}
                      {editBigKey===bigExpKey
                        ?<div style={{padding:"8px 10px",display:"flex",alignItems:"center",gap:6,background:"#f4f0f8"}}>
                          <input autoFocus value={editBigVal} onChange={e=>setEditBigVal(e.target.value)}
                            onKeyDown={e=>{if(e.key==="Enter")renameBig(grade,big,editBigVal);if(e.key==="Escape"){setEditBigKey(null);setEditBigVal("");}}}
                            style={{flex:1,border:`1.5px solid ${C.a1}`,borderRadius:8,padding:"6px 10px",fontSize:12,color:C.tx,background:"#fff",outline:"none"}}/>
                          <button onClick={()=>renameBig(grade,big,editBigVal)} style={{background:C.a1,border:"none",color:"#fff",borderRadius:8,padding:"7px 13px",fontSize:12,fontWeight:700,cursor:"pointer",flexShrink:0}}>저장</button>
                          <button onClick={()=>{setEditBigKey(null);setEditBigVal("");}} style={{background:"none",border:"none",color:C.sub,cursor:"pointer",fontSize:15,padding:"0 4px"}}>✕</button>
                        </div>
                        :<div style={{padding:"9px 12px",display:"flex",alignItems:"center",gap:8,cursor:"pointer",background:"#f4f0f8"}} onClick={()=>setExpandedBig(p=>({...p,[bigExpKey]:!isBigExp}))}>
                          <span style={{fontSize:10,color:C.a1,fontWeight:700}}>{isBigExp?"▼":"▶"}</span>
                          <div style={{flex:1}}>
                            <span style={{fontSize:12,fontWeight:700,color:C.tx}}>{big}</span>
                          </div>
                          <button onClick={e=>{e.stopPropagation();setEditBigKey(bigExpKey);setEditBigVal(big);}} style={{background:"none",border:"none",color:C.a1,cursor:"pointer",fontSize:14,padding:"2px 6px"}}>✏️</button>
                          <button onClick={e=>{e.stopPropagation();delBig(grade,big);}} style={{background:"none",border:"none",color:"#c07070",cursor:"pointer",fontSize:11,padding:"2px 6px",fontWeight:700}}>삭제</button>
                        </div>
                      }

                      {isBigExp&&<div style={{background:"#fff"}}>
                        {/* 선택 교재의 중단원 목록 */}
                        <div style={{border:`1px solid ${C.br}`,borderRadius:"0 0 8px 8px",padding:"10px 12px",marginTop:0}}>
                          {midKeys.length===0&&<div style={{fontSize:11,color:"#ccc",padding:"4px 0",marginBottom:8}}>{selBook} 교재의 중단원을 추가해보세요</div>}
                          {midKeys.map(mid=>{
                            const midExpKey=grade+"__"+big+"__"+selBook+"__"+mid;
                            const isMidExp=expandedMid[midExpKey]!==false;
                            const subs=midsForBook[mid]||[];
                            return(
                              <div key={mid} style={{borderRadius:8,border:`1px solid ${editMidKey===midExpKey?C.a1:C.br}`,marginBottom:6,overflow:"hidden"}}>
                                {editMidKey===midExpKey
                                  ?<div style={{padding:"7px 10px",display:"flex",alignItems:"center",gap:6,background:"#f8f5fc"}}>
                                    <input autoFocus value={editMidVal} onChange={e=>setEditMidVal(e.target.value)}
                                      onKeyDown={e=>{if(e.key==="Enter")renameMid(grade,big,selBook,mid,editMidVal);if(e.key==="Escape"){setEditMidKey(null);setEditMidVal("");}}}
                                      style={{flex:1,border:`1.5px solid ${C.a1}`,borderRadius:7,padding:"5px 9px",fontSize:12,color:C.tx,background:"#fff",outline:"none"}}/>
                                    <button onClick={()=>renameMid(grade,big,selBook,mid,editMidVal)} style={{background:C.a1,border:"none",color:"#fff",borderRadius:7,padding:"5px 11px",fontSize:11,fontWeight:700,cursor:"pointer",flexShrink:0}}>저장</button>
                                    <button onClick={()=>{setEditMidKey(null);setEditMidVal("");}} style={{background:"none",border:"none",color:C.sub,cursor:"pointer",fontSize:14,padding:"0 3px"}}>✕</button>
                                  </div>
                                  :<div style={{padding:"7px 10px",display:"flex",alignItems:"center",gap:6,cursor:"pointer",background:isMidExp?"#f8f5fc":"#fff"}} onClick={()=>setExpandedMid(p=>({...p,[midExpKey]:!isMidExp}))}>
                                    <span style={{fontSize:9,color:C.sub}}>{isMidExp?"▼":"▶"}</span>
                                    <div style={{flex:1,fontSize:12,fontWeight:600,color:C.tx}}>{mid}</div>
                                    <span style={{fontSize:10,color:C.sub}}>소단원 {subs.length}개</span>
                                    <button onClick={e=>{e.stopPropagation();setEditMidKey(midExpKey);setEditMidVal(mid);}} style={{background:"none",border:"none",color:C.a1,cursor:"pointer",fontSize:13,padding:"0 5px"}}>✏️</button>
                                    <button onClick={e=>{e.stopPropagation();delMid(grade,big,selBook,mid);}} style={{background:"none",border:"none",color:"#c07070",cursor:"pointer",fontSize:13,padding:"0 2px"}}>×</button>
                                  </div>
                                }
                                {isMidExp&&<div style={{borderTop:`1px solid ${C.br}`,background:"#fdfcff",padding:"8px 10px"}}>
                                  {subs.map((sub,si)=>{
                                    const eKey=grade+"__"+big+"__"+selBook+"__"+mid+"__"+si;
                                    const isEditing=editSubKey===eKey;
                                    return(
                                      <div key={si} style={{display:"flex",alignItems:"center",gap:6,padding:"4px 6px",background:"#f8f6fc",borderRadius:6,border:`1px solid ${isEditing?C.a1:C.br}`,marginBottom:4}}>
                                        <span style={{fontSize:10,color:C.sub,minWidth:16,flexShrink:0}}>{si+1}.</span>
                                        {isEditing
                                          ?<>
                                            <input autoFocus value={editSubVal} onChange={e=>setEditSubVal(e.target.value)}
                                              onKeyDown={e=>{if(e.key==="Enter")renameSub(grade,big,selBook,mid,si,editSubVal);if(e.key==="Escape"){setEditSubKey(null);setEditSubVal("");}}}
                                              style={{flex:1,border:"none",background:"transparent",fontSize:12,color:C.tx,outline:"none",padding:0}}/>
                                            <button onClick={()=>renameSub(grade,big,selBook,mid,si,editSubVal)} style={{background:C.a1,border:"none",color:"#fff",borderRadius:5,padding:"2px 8px",fontSize:11,cursor:"pointer",fontWeight:700}}>저장</button>
                                            <button onClick={()=>{setEditSubKey(null);setEditSubVal("");}} style={{background:"none",border:"none",color:C.sub,cursor:"pointer",fontSize:12,padding:"0 2px"}}>✕</button>
                                          </>
                                          :<>
                                            <span style={{flex:1,fontSize:12,color:C.tx}}>{sub}</span>
                                            <button onClick={()=>{setEditSubKey(eKey);setEditSubVal(sub);}} style={{background:"none",border:"none",color:C.a1,cursor:"pointer",fontSize:12,padding:"0 4px"}}>✏️</button>
                                            <button onClick={()=>delSub(grade,big,selBook,mid,sub)} style={{background:"none",border:"none",color:"#c07070",cursor:"pointer",fontSize:14,padding:0}}>×</button>
                                          </>
                                        }
                                      </div>
                                    );
                                  })}
                                  <div style={{display:"flex",gap:6,marginTop:4}}>
                                    <input value={newSub[grade+"__"+big+"__"+selBook+"__"+mid]||""} onChange={e=>setNewSub(p=>({...p,[grade+"__"+big+"__"+selBook+"__"+mid]:e.target.value}))} onKeyDown={e=>e.key==="Enter"&&addSub(grade,big,selBook,mid)} placeholder="소단원 추가" style={{...iStyle,fontSize:11}}/>
                                    <button onClick={()=>addSub(grade,big,selBook,mid)} style={{...btnAdd,fontSize:11,padding:"5px 9px"}}>+ 소단원</button>
                                  </div>
                                </div>}
                              </div>
                            );
                          })}
                          {/* 중단원 추가 */}
                          <div style={{display:"flex",gap:6,marginTop:4}}>
                            <input value={newMid[grade+"__"+big+"__"+selBook]||""} onChange={e=>setNewMid(p=>({...p,[grade+"__"+big+"__"+selBook]:e.target.value}))} onKeyDown={e=>e.key==="Enter"&&addMid(grade,big,selBook)} placeholder={selBook+" 중단원 추가"} style={{...iStyle,fontSize:11}}/>
                            <button onClick={()=>addMid(grade,big,selBook)} style={{...btnAdd,fontSize:11,padding:"5px 9px",borderColor:C.a2,color:C.a3}}>+ 중단원</button>
                          </div>
                        </div>
                      </div>}
                    </div>
                  );
                })}
                {/* 대단원 추가 */}
                <div style={{display:"flex",gap:8,marginTop:6}}>
                  <input value={newBig[grade]||""} onChange={e=>setNewBig(p=>({...p,[grade]:e.target.value}))} onKeyDown={e=>e.key==="Enter"&&addBig(grade)} placeholder="대단원 추가 (예: I. 수와 연산)" style={iStyle}/>
                  <button onClick={()=>addBig(grade)} style={{...btnAdd,borderColor:C.a3,color:C.a3,padding:"7px 10px",fontSize:11}}>+ 대단원</button>
                </div>
              </div>
            </div>}
          </div>
        );
      })}
    </div>
  );
}

function ProgressChecker({cards,curriculum,gradeOrder}){
  const[progress,setProgress]=useState({});
  const[fbReady,setFbReady]=useState(!!window.__fbReady);
  const[loading,setLoading]=useState(true);
  const grades=gradeOrder.filter(g=>curriculum[g]);
  const[selGrade,setSelGrade]=useState(grades[0]||"");
  const[selBook,setSelBook]=useState((curriculum[grades[0]]?.books||[])[0]||"");
  const[openBigs,setOpenBigs]=useState({});
  const[openMids,setOpenMids]=useState({});

  useEffect(()=>{if(!fbReady){const h=()=>setFbReady(true);window.addEventListener("fbReady",h);return()=>window.removeEventListener("fbReady",h);}});
  useEffect(()=>{
    if(!fbReady)return;
    const{doc,getDoc}=window.__fb;
    getDoc(doc(window.__db,"progress","main")).then(snap=>{if(snap.exists())setProgress(snap.data());setLoading(false);}).catch(()=>setLoading(false));
  },[fbReady]);
  useEffect(()=>{
    if(!grades.includes(selGrade)&&grades.length>0){setSelGrade(grades[0]);setSelBook((curriculum[grades[0]]?.books||[])[0]||"");}
  },[curriculum,gradeOrder]);

  const saveProgress=async(np)=>{if(!window.__fbReady)return;try{const{doc,setDoc}=window.__fb;await setDoc(doc(window.__db,"progress","main"),np);}catch(e){console.error(e);}};
  const getRaw=(grade,book,big,mid,sub)=>progress[`${grade}__${book}__${big}__${mid}__${sub}`];
  const getStatus=(grade,book,big,mid,sub)=>{const v=getRaw(grade,book,big,mid,sub);if(!v)return"none";if(typeof v==="string")return v;return v.status||"none";};
  const getDate=(grade,book,big,mid,sub)=>{const v=getRaw(grade,book,big,mid,sub);if(!v||typeof v==="string")return null;return v.status==="done"?(v.doneDate||v.date||null):v.status==="doing"?(v.date||null):null;};
  const setStatus=(grade,book,big,mid,sub,status)=>{
    const key=`${grade}__${book}__${big}__${mid}__${sub}`;
    const today=new Date().toLocaleDateString("ko-KR",{month:"2-digit",day:"2-digit"}).replace(". ","월 ").replace(".","일");
    const prev=getRaw(grade,book,big,mid,sub);const prevObj=typeof prev==="object"&&prev?prev:{};
    let entry;
    if(status==="none")entry={status:"none",date:"",doneDate:""};
    else if(status==="doing")entry={status:"doing",date:today,doneDate:prevObj.doneDate||""};
    else entry={status:"done",doneDate:today,date:prevObj.date||today};
    const next={...progress,[key]:entry};setProgress(next);saveProgress(next);
  };
  const nextStatus=s=>s==="none"?"doing":s==="doing"?"done":"none";
  const getWrongCount=(grade,book,big,mid,sub)=>cards.filter(c=>c.grade===grade&&c.book===book&&c.bigChapter===big&&c.midChapter===mid&&c.subChapter===sub).length;

  const getMids=(grade,book,big)=>Object.keys(curriculum[grade]?.chapters?.[big]?.bookMids?.[book]||{});
  const getSubs=(grade,book,big,mid)=>curriculum[grade]?.chapters?.[big]?.bookMids?.[book]?.[mid]||[];

  const calcRate=(grade,book)=>{
    const chs=curriculum[grade]?.chapters||{};
    let total=0,done=0,doing=0;
    Object.keys(chs).forEach(big=>{
      getMids(grade,book,big).forEach(mid=>{
        getSubs(grade,book,big,mid).forEach(sub=>{total++;const s=getStatus(grade,book,big,mid,sub);if(s==="done")done++;if(s==="doing")doing++;});
      });
    });
    return{total,done,doing,pct:total>0?Math.round(done/total*100):0};
  };

  const saveProgressImage=async()=>{
    const today=new Date().toLocaleDateString("ko-KR");
    const r=calcRate(selGrade,selBook);
    const chs=curriculum[selGrade]?.chapters||{};
    const BD="#e8e2f4",BIG_BG="#ede8f8",MID_BG="#f6f3fc";
    let trs="";
    Object.keys(chs).forEach(big=>{
      const mids=getMids(selGrade,selBook,big);
      let bigTotal=0,bigDone=0,bigDoing=0;
      mids.forEach(mid=>getSubs(selGrade,selBook,big,mid).forEach(sub=>{bigTotal++;const s=getStatus(selGrade,selBook,big,mid,sub);if(s==="done")bigDone++;else if(s==="doing")bigDoing++;}));
      trs+=`<tr style="background:${BIG_BG};"><td colspan="4" style="padding:7px 14px;font-weight:800;font-size:12px;color:#2d1f4a;border-bottom:2px solid #c8b8e0;">${big}<span style="float:right;font-size:10px;font-weight:600;color:#7c5cb8;">${bigDone}/${bigTotal} 완료${bigDoing>0?" · "+bigDoing+"진행":""}</span></td></tr>`;
      mids.forEach(mid=>{
        const subs=getSubs(selGrade,selBook,big,mid);if(!subs.length)return;
        let midDone=0;subs.forEach(sub=>{if(getStatus(selGrade,selBook,big,mid,sub)==="done")midDone++;});
        trs+=`<tr style="background:${MID_BG};"><td colspan="4" style="padding:5px 14px 5px 22px;font-weight:700;font-size:11px;color:#5e3f9a;border-bottom:1px solid ${BD};"> ${mid}<span style="font-size:10px;font-weight:400;color:#9a8ab0;margin-left:8px;">${midDone}/${subs.length}</span></td></tr>`;
        subs.forEach((sub,si)=>{
          const st=getStatus(selGrade,selBook,big,mid,sub);
          const rv=getRaw(selGrade,selBook,big,mid,sub);
          const startD=typeof rv==="object"&&rv?.date?rv.date:"-";
          const doneD=typeof rv==="object"&&rv?.doneDate&&st==="done"?rv.doneDate:"-";
          const wc=getWrongCount(selGrade,selBook,big,mid,sub);
          const stColor=st==="done"?"#5ab98a":st==="doing"?"#d4a04a":"#bbb";
          const stIcon=st==="done"?"✓":st==="doing"?"◐":"○";
          const rowBg=st==="done"?"#f5fff8":st==="doing"?"#fffef2":"#ffffff";
          trs+=`<tr style="background:${rowBg};border-bottom:1px solid ${si===subs.length-1?BD:"#f0eaf8"};"><td style="padding:5px 14px 5px 30px;font-size:11px;color:${st==="done"?"#3a9a6a":"#2d1f4a"};border-right:1px solid ${BD};"><span style="color:${stColor};margin-right:5px;font-weight:700;">${stIcon}</span>${sub}</td><td style="padding:5px 12px;font-size:10px;color:#9a8ab0;text-align:center;border-right:1px solid ${BD};white-space:nowrap;">${startD}</td><td style="padding:5px 12px;font-size:10px;color:${st==="done"?"#5ab98a":"#9a8ab0"};text-align:center;border-right:1px solid ${BD};white-space:nowrap;">${doneD}</td><td style="padding:5px 12px;font-size:10px;text-align:center;color:${wc>0?"#d05050":"#bbb"};font-weight:${wc>0?700:400};">${wc>0?wc+"개":"-"}</td></tr>`;
        });
      });
    });
    const el=document.createElement("div");
    el.style.cssText="position:fixed;left:-9999px;top:0;width:520px;background:white;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;";
    el.innerHTML=`<div style="background:white;padding:16px 20px 12px;border-bottom:2px solid #9b7fd4;"><div style="font-size:9px;color:#9b7fd4;letter-spacing:2px;margin-bottom:4px;font-weight:600;">수학천재 김서윤 🌱</div><div style="display:flex;align-items:flex-end;justify-content:space-between;"><div><div style="font-size:20px;font-weight:900;color:#5e3f9a;line-height:1.1;">${selGrade}</div><div style="font-size:12px;color:#7c5cb8;margin-top:3px;font-weight:600;">${selBook} · 진도 체크</div></div><div style="text-align:right;"><div style="font-size:28px;font-weight:900;color:#5e3f9a;line-height:1;">${r.pct}%</div><div style="font-size:9px;color:#9a8ab0;margin-top:2px;">${r.done}/${r.total} 완료 · ${today}</div></div></div><div style="margin-top:10px;background:#ede5f8;border-radius:99px;height:5px;overflow:hidden;"><div style="height:100%;width:${r.pct}%;background:linear-gradient(90deg,#9b7fd4,#5e3f9a);border-radius:99px;"></div></div></div><table style="width:100%;border-collapse:collapse;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;"><thead><tr style="background:#f4f0f8;"><th style="padding:7px 14px;font-size:10px;color:#5e3f9a;text-align:left;font-weight:700;border-bottom:2px solid #9b7fd4;border-right:1px solid ${BD};">단 원</th><th style="padding:7px 12px;font-size:10px;color:#5e3f9a;text-align:center;font-weight:700;border-bottom:2px solid #9b7fd4;border-right:1px solid ${BD};">시작일</th><th style="padding:7px 12px;font-size:10px;color:#5e3f9a;text-align:center;font-weight:700;border-bottom:2px solid #9b7fd4;border-right:1px solid ${BD};">완료일</th><th style="padding:7px 12px;font-size:10px;color:#5e3f9a;text-align:center;font-weight:700;border-bottom:2px solid #9b7fd4;">오답수</th></tr></thead><tbody>${trs}</tbody></table><div style="padding:5px 14px 7px;text-align:right;font-size:8px;color:#bbb;background:#faf8fc;border-top:1px solid ${BD};">${today} 출력</div>`;
    document.body.appendChild(el);
    try{const canvas=await html2canvas(el,{backgroundColor:"#ffffff",scale:2,useCORS:true,logging:false});canvas.toBlob(blob=>{if(!blob)return alert("이미지 생성 실패");const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="진도체크_"+selGrade+"_"+selBook+"_"+today.replace(/\. /g,"").replace(/\./g,"")+".png";document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(url),3000);},"image/png");}
    catch(e){alert("이미지 저장 실패: "+e.message);}
    finally{document.body.removeChild(el);}
  };

  if(loading)return<div style={{textAlign:"center",padding:"60px 0",color:C.sub,fontSize:14}}>불러오는 중... 🌱</div>;
  if(!grades.length)return<div style={{textAlign:"center",padding:"60px 0",color:"#ccc",fontSize:13}}>교재관리 탭에서 학기를 먼저 추가해주세요 🌱</div>;

  const books=curriculum[selGrade]?.books||[];
  const chapters=curriculum[selGrade]?.chapters||{};
  const rate=calcRate(selGrade,selBook);

  return(
    <div>
      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12}}>
        {grades.map(g=>(
          <button key={g} onClick={()=>{setSelGrade(g);const bs=curriculum[g]?.books||[];setSelBook(bs[0]||"");setOpenBigs({});setOpenMids({});}}
            style={{borderRadius:20,border:`1.5px solid ${selGrade===g?C.a1:C.br}`,background:selGrade===g?C.hd:"#fff",color:selGrade===g?C.a2:C.sub,padding:"5px 12px",fontSize:12,fontWeight:700,cursor:"pointer"}}>
            {g}
          </button>
        ))}
      </div>
      {books.length>0&&<div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:14}}>
        {books.map(b=>(
          <button key={b} onClick={()=>setSelBook(b)}
            style={{borderRadius:20,border:`1.5px solid ${selBook===b?C.a2:C.br}`,background:selBook===b?`linear-gradient(135deg,${C.a1},${C.a2})`:"#fff",color:selBook===b?"#fff":C.sub,padding:"5px 14px",fontSize:12,fontWeight:700,cursor:"pointer"}}>
            {b}
          </button>
        ))}
      </div>}

      {selBook&&<div style={{background:"#fff",borderRadius:16,padding:"14px 16px",marginBottom:14,border:`1.5px solid ${C.br}`,boxShadow:"0 2px 10px rgba(155,127,212,.07)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <div style={{fontWeight:800,fontSize:14,color:C.tx}}>{selGrade} · {selBook}</div>
          <div style={{fontWeight:900,fontSize:22,color:C.a2}}>{rate.pct}%</div>
        </div>
        <div style={{background:"#f0eaf8",borderRadius:99,height:10,overflow:"hidden",marginBottom:7}}>
          <div style={{height:"100%",width:`${rate.pct}%`,background:`linear-gradient(90deg,${C.a1},${C.a2})`,borderRadius:99,transition:"width 0.4s"}}/>
        </div>
        <div style={{display:"flex",gap:12,fontSize:11}}>
          <span style={{color:"#5ab98a",fontWeight:700}}>● 완료 {rate.done}</span>
          <span style={{color:"#d4a04a",fontWeight:700}}>◐ 진행중 {rate.doing}</span>
          <span style={{color:"#ccc",fontWeight:700}}>○ 안함 {rate.total-rate.done-rate.doing}</span>
        </div>
      </div>}

      <button onClick={saveProgressImage} style={{width:"100%",borderRadius:12,border:`1.5px solid ${C.a1}`,background:"#fff",color:C.a2,padding:"10px 0",fontWeight:700,fontSize:13,cursor:"pointer",marginBottom:12,display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
        🖼️ 진도표 이미지 저장
      </button>

      <div style={{display:"flex",flexDirection:"column",gap:8,paddingBottom:24}}>
        {Object.keys(chapters).map(big=>{
          const bigKey=`${selGrade}__${selBook}__${big}`;
          const isBigOpen=openBigs[bigKey]!==false;
          const mids=getMids(selGrade,selBook,big);
          let bigTotal=0,bigDone=0,bigDoing=0;
          mids.forEach(mid=>{getSubs(selGrade,selBook,big,mid).forEach(sub=>{bigTotal++;const s=getStatus(selGrade,selBook,big,mid,sub);if(s==="done")bigDone++;if(s==="doing")bigDoing++;});});
          const allBigDone=bigTotal>0&&bigDone===bigTotal;const anyBigActive=bigDone>0||bigDoing>0;

          return(
            <div key={big} style={{background:"#fff",borderRadius:14,overflow:"hidden",border:`1.5px solid ${allBigDone?C.a1:anyBigActive?"#e0d0f0":C.br}`,boxShadow:"0 2px 8px rgba(155,127,212,.06)"}}>
              <div onClick={()=>setOpenBigs(p=>({...p,[bigKey]:!isBigOpen}))} style={{padding:"11px 14px",background:allBigDone?C.hd:anyBigActive?"#f8f4fc":"#fff",display:"flex",alignItems:"center",cursor:"pointer",gap:10}}>
                <span style={{fontSize:12,color:allBigDone?C.a2:anyBigActive?C.a1:C.sub}}>{isBigOpen?"▼":"▶"}</span>
                <div style={{flex:1}}>
                  <div style={{fontWeight:700,fontSize:13,color:C.tx}}>{big}</div>
                  <div style={{fontSize:10,color:C.sub}}>{bigDone}/{bigTotal} 완료{bigDoing>0?` · ${bigDoing}개 진행중`:""}</div>
                </div>
                <div style={{fontSize:11,fontWeight:800,color:allBigDone?C.a2:anyBigActive?C.a1:"#ccc"}}>{allBigDone?"✓완료":anyBigActive?"진행중":"미시작"}</div>
              </div>

              {isBigOpen&&<div style={{borderTop:`1px solid ${C.br}`}}>
                {mids.map(mid=>{
                  const midKey=`${selGrade}__${selBook}__${big}__${mid}`;
                  const isMidOpen=openMids[midKey]!==false;
                  const subs=getSubs(selGrade,selBook,big,mid);
                  let midDone=0,midDoing=0;
                  subs.forEach(sub=>{const s=getStatus(selGrade,selBook,big,mid,sub);if(s==="done")midDone++;if(s==="doing")midDoing++;});
                  const allMidDone=subs.length>0&&midDone===subs.length;const anyMidActive=midDone>0||midDoing>0;

                  return(
                    <div key={mid} style={{borderBottom:`1px solid ${C.br}`}}>
                      <div onClick={()=>setOpenMids(p=>({...p,[midKey]:!isMidOpen}))} style={{padding:"9px 14px 9px 22px",display:"flex",alignItems:"center",gap:8,cursor:"pointer",background:allMidDone?"#f5fbf0":anyMidActive?"#fdfaff":"#fafafa"}}>
                        <span style={{fontSize:10,color:allMidDone?"#5ab98a":anyMidActive?C.a1:C.sub}}>{isMidOpen?"▼":"▶"}</span>
                        <div style={{flex:1}}>
                          <div style={{fontSize:12,fontWeight:600,color:C.tx}}>{mid}</div>
                          <div style={{fontSize:10,color:C.sub}}>{midDone}/{subs.length} 완료</div>
                        </div>
                        <div style={{fontSize:10,fontWeight:700,color:allMidDone?"#5ab98a":anyMidActive?C.a1:"#ccc"}}>{allMidDone?"✓":"·"}</div>
                      </div>

                      {isMidOpen&&subs.length>0&&<div style={{borderTop:`1px solid #f0eaf8`,background:"#fff"}}>
                        {subs.map((sub,si)=>{
                          const st=getStatus(selGrade,selBook,big,mid,sub);
                          const dt=getDate(selGrade,selBook,big,mid,sub);
                          const wc=getWrongCount(selGrade,selBook,big,mid,sub);
                          const s=STATUS[st];
                          return(
                            <div key={si} style={{display:"flex",alignItems:"center",padding:"9px 14px 9px 22px",gap:8,borderBottom:si<subs.length-1?`1px solid #f5f0fc`:"none",background:st==="done"?"#fafff8":st==="doing"?"#fffef5":"#fff"}}>
                              <span style={{fontSize:11,color:"#bbb",minWidth:20,flexShrink:0,textAlign:"right",fontWeight:600}}>{si+1}.</span>
                              <button onClick={()=>setStatus(selGrade,selBook,big,mid,sub,nextStatus(st))}
                                style={{width:28,height:28,borderRadius:"50%",border:`2px solid ${s.color}`,background:s.bg,color:s.color,fontSize:13,cursor:"pointer",fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,transition:"all 0.15s"}}>
                                {s.icon}
                              </button>
                              <div style={{flex:1,minWidth:0}}>
                                <div style={{fontSize:12,color:st==="done"?"#5ab98a":C.tx,fontWeight:st==="done"?600:400}}>{sub}</div>
                                {dt&&<div style={{fontSize:10,color:st==="done"?"#5ab98a":C.a1,marginTop:1,opacity:0.8}}>
                                  {st==="done"
                                    ?(()=>{const v=getRaw(selGrade,selBook,big,mid,sub);const startD=typeof v==="object"&&v?.date?v.date:null;return startD&&startD!==dt?`${startD} ~ ${dt}`:`✓ ${dt}`;})()
                                    :`◐ ${dt}`}
                                </div>}
                              </div>
                              {wc>0&&<div style={{background:"#fdeaea",border:"1px solid #e07a7a",borderRadius:10,padding:"2px 7px",fontSize:10,color:"#e07a7a",fontWeight:700,flexShrink:0}}>📓{wc}</div>}
                              <div style={{fontSize:10,color:s.color,fontWeight:700,flexShrink:0,minWidth:32,textAlign:"right"}}>{s.label}</div>
                            </div>
                          );
                        })}
                      </div>}
                      {isMidOpen&&subs.length===0&&<div style={{padding:"8px 14px 8px 34px",fontSize:11,color:"#ccc",borderTop:`1px solid #f0eaf8`}}>교재관리에서 {selBook}·{mid} 소단원을 추가해주세요</div>}
                    </div>
                  );
                })}
                {mids.length===0&&<div style={{padding:"12px 14px",fontSize:11,color:"#ccc"}}>교재관리에서 {selBook} 교재의 중단원을 추가해주세요</div>}
              </div>}
            </div>
          );
        })}
        {Object.keys(chapters).length===0&&<div style={{textAlign:"center",padding:"40px 0",color:"#ccc",fontSize:13}}>교재관리 탭에서 단원을 추가해주세요 📖</div>}
      </div>
    </div>
  );
}

function AccuracyTracker({curriculum,gradeOrder}){
  const[accData,setAccData]=useState({});
  const[fbReady,setFbReady]=useState(!!window.__fbReady);
  const[loading,setLoading]=useState(true);
  const grades=gradeOrder.filter(g=>curriculum[g]);
  const[selGrade,setSelGrade]=useState(grades[0]||"");
  const[selBook,setSelBook]=useState((curriculum[grades[0]]?.books||[])[0]||"");
  const[openBigs,setOpenBigs]=useState({});
  const[chartView,setChartView]=useState(false);

  useEffect(()=>{if(!fbReady){const h=()=>setFbReady(true);window.addEventListener("fbReady",h);return()=>window.removeEventListener("fbReady",h);}});
  useEffect(()=>{
    if(!fbReady)return;
    const{doc,getDoc}=window.__fb;
    getDoc(doc(window.__db,"settings","accuracy")).then(snap=>{
      if(snap.exists()&&snap.data().data){try{setAccData(JSON.parse(snap.data().data));}catch(e){}}
      setLoading(false);
    }).catch(()=>setLoading(false));
  },[fbReady]);
  useEffect(()=>{
    if(!grades.includes(selGrade)&&grades.length>0){
      const g=grades[0];setSelGrade(g);setSelBook((curriculum[g]?.books||[])[0]||"");
    }
  },[curriculum,gradeOrder]);

  const saveAcc=async(nd)=>{if(!window.__fbReady)return;try{const{doc,setDoc}=window.__fb;await setDoc(doc(window.__db,"settings","accuracy"),{data:JSON.stringify(nd)});}catch(e){console.error(e);}};

  const ensurePath=(next,grade,book,big)=>{
    if(!next[grade])next[grade]={};if(!next[grade][book])next[grade][book]={};
    if(!next[grade][book][big])next[grade][book][big]={mids:{},final:{total:"",wrong:""}};
    if(!next[grade][book][big].mids)next[grade][book][big].mids={};
  };
  const getVal=(grade,book,big,mid,diff)=>accData?.[grade]?.[book]?.[big]?.mids?.[mid]?.[diff]||{total:"",wrong:""};
  const getFinal=(grade,book,big)=>accData?.[grade]?.[book]?.[big]?.final||{total:"",wrong:""};
  const setVal=(grade,book,big,mid,diff,field,value)=>{
    const num=value===""?"":Math.max(0,parseInt(value)||0);
    const next=JSON.parse(JSON.stringify(accData));
    ensurePath(next,grade,book,big);
    if(!next[grade][book][big].mids[mid])next[grade][book][big].mids[mid]={};
    if(!next[grade][book][big].mids[mid][diff])next[grade][book][big].mids[mid][diff]={total:"",wrong:""};
    next[grade][book][big].mids[mid][diff][field]=num;
    setAccData(next);saveAcc(next);
  };
  const setFinalVal=(grade,book,big,field,value)=>{
    const num=value===""?"":Math.max(0,parseInt(value)||0);
    const next=JSON.parse(JSON.stringify(accData));
    ensurePath(next,grade,book,big);
    next[grade][book][big].final={...next[grade][book][big].final,[field]:num};
    setAccData(next);saveAcc(next);
  };

  // 교재관리에서 가져온 중단원 목록
  const getMids=(grade,book,big)=>Object.keys(curriculum[grade]?.chapters?.[big]?.bookMids?.[book]||{});

  const calcRate=(total,wrong)=>{const t=parseInt(total)||0;const w=parseInt(wrong)||0;if(t===0)return null;return Math.round(Math.max(0,t-w)/t*100);};
  const rateColor=(pct)=>pct===null?"#bbb":pct>=90?"#5ab98a":pct>=70?"#d4a04a":"#e07a7a";
  const rateBg=(pct)=>pct===null?"#f5f5f5":pct>=90?"#e8f7ef":pct>=70?"#fef6e4":"#fdeaea";

  const calcMidTotals=(grade,book,big,mid)=>{
    let t=0,w=0,any=false;
    DIF.forEach(d=>{const v=getVal(grade,book,big,mid,d);const tv=parseInt(v.total)||0;const wv=parseInt(v.wrong)||0;if(tv>0)any=true;t+=tv;w+=wv;});
    return any?{total:t,wrong:w}:null;
  };
  const calcBigTotals=(grade,book,big)=>{
    let t=0,w=0,any=false;
    getMids(grade,book,big).forEach(mid=>{DIF.forEach(d=>{const v=getVal(grade,book,big,mid,d);const tv=parseInt(v.total)||0;const wv=parseInt(v.wrong)||0;if(tv>0)any=true;t+=tv;w+=wv;});});
    const fin=getFinal(grade,book,big);const ft=parseInt(fin.total)||0;const fw=parseInt(fin.wrong)||0;if(ft>0)any=true;t+=ft;w+=fw;
    return any?{total:t,wrong:w}:null;
  };

  const numInp={width:44,borderRadius:7,border:"1.5px solid "+C.br,padding:"5px 4px",fontSize:12,textAlign:"center",background:"#fff",color:C.tx,outline:"none"};
  const difColor={A:["#b5e0f7","#2a7fa0"],B:["#c8e8b0","#3a7a20"],C:["#f4d0e8","#a03060"]};

  const saveAccImage=async()=>{
    const today=new Date().toLocaleDateString("ko-KR");
    const chs=curriculum[selGrade]?.chapters||{};
    const rC=pct=>pct===null?"#999":pct>=90?"#3a9a6a":pct>=70?"#b88030":"#d05050";
    const rBg=pct=>pct===null?"transparent":pct>=90?"#e4f7ec":pct>=70?"#fdf3e0":"#fde8e8";
    const BD="#e4dff4";
    const A_H="#d0e8f5",A_C="#edf5fb";
    const B_H="#ceecd0",B_C="#ecf8ed";
    const C_H="#f5d4ec",C_C="#fbeef7";
    const S_H="#e0d8f2",S_C="#f2eefb";
    const pBadge=(pct)=>pct!==null
