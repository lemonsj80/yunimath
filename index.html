                          {midTot&&<div style={{display:"flex",alignItems:"center",justifyContent:"flex-end",gap:6,paddingTop:6}}>
                            <span style={{fontSize:10,color:C.sub}}>합계 · {midTot.total}문제 중 {midTot.total-midTot.wrong}정답</span>
                            <div style={{background:rateColor(midPct),color:"#fff",borderRadius:20,padding:"2px 10px",fontWeight:800,fontSize:12}}>{midPct}%</div>
                          </div>}
                        </div>
                      </div>
                    );
                  })}
                  {/* 대단원 문제 */}
                  <div>
                    <div style={{padding:"9px 14px 6px",background:"#f0eaf8"}}>
                      <div style={{fontWeight:700,fontSize:12,color:C.a2}}>📌 대단원 문제</div>
                    </div>
                    <div style={{padding:"6px 14px 10px"}}>
                      {(()=>{
                        const fin=getFinal(selGrade,selBook,big);
                        const pct=calcRate(fin.total,fin.wrong);
                        return(
                          <div style={{display:"flex",alignItems:"center",gap:8}}>
                            <span style={{fontSize:10,color:C.sub,whiteSpace:"nowrap"}}>총</span>
                            <input type="number" min="0" value={fin.total} onChange={e=>setFinalVal(selGrade,selBook,big,"total",e.target.value)} style={numInp} placeholder="0"/>
                            <span style={{fontSize:10,color:C.sub,whiteSpace:"nowrap"}}>개 틀림</span>
                            <input type="number" min="0" value={fin.wrong} onChange={e=>setFinalVal(selGrade,selBook,big,"wrong",e.target.value)} style={{...numInp,border:"1.5px solid "+(pct!==null&&pct<70?"#e07a7a":C.br)}} placeholder="0"/>
                            <span style={{fontSize:10,color:C.sub,whiteSpace:"nowrap"}}>개</span>
                            <div style={{background:rateBg(pct),border:"1px solid "+rateColor(pct),color:rateColor(pct),borderRadius:20,padding:"2px 9px",fontWeight:800,fontSize:12,minWidth:46,textAlign:"center",flexShrink:0}}>
                              {pct!==null?pct+"%":"—"}
                            </div>
                          </div>
                        );
                      })()}
                    </div>
                  </div>
                </div>}
              </div>
            );
          })}
          {Object.keys(chapters).length===0&&<div style={{textAlign:"center",padding:"60px 0",color:"#ccc",fontSize:13}}>교재관리 탭에서 단원을 추가해주세요 📖</div>}
        </div>
      </>}
    </div>
  );
}

// ── 공부 일기 ─────────────────────────────────────────────────
async function saveDiaryEntry(entry){
  if(!window.__fbReady)return null;
  try{
    const{collection,addDoc,doc,updateDoc}=window.__fb;
    if(entry.fireId){
      const ref=doc(window.__db,"diary",entry.fireId);
      const{fireId,...data}=entry;
      await updateDoc(ref,data);
      return entry.fireId;
    } else {
      const ref=await addDoc(collection(window.__db,"diary"),entry);
      return ref.id;
    }
  }catch(e){console.error(e);return null;}
}
async function deleteDiaryEntry(fireId){
  if(!window.__fbReady)return;
  try{const{doc,deleteDoc}=window.__fb;await deleteDoc(doc(window.__db,"diary",fireId));}
  catch(e){console.error(e);}
}

function StudyDiary(){
  const[entries,setEntries]=useState([]);
  const[loading,setLoading]=useState(true);
  const[view,setView]=useState("cal"); // "cal" | "list" | "write" | "detail"
  const[selDate,setSelDate]=useState(null);
  const[calMonth,setCalMonth]=useState(()=>{const d=new Date();return{y:d.getFullYear(),m:d.getMonth()};});
  const[editEntry,setEditEntry]=useState(null);
  const[saving,setSaving]=useState(false);

  // 입력 폼 state
  const today=new Date().toLocaleDateString("ko-KR",{year:"numeric",month:"2-digit",day:"2-digit"}).replace(/\.\s*/g,"-").replace(/-$/,"");
  const[formDate,setFormDate]=useState(today);
  const[formGoals,setFormGoals]=useState([{text:"",done:false}]);
  const[formMemo,setFormMemo]=useState("");

  useEffect(()=>{
    if(!window.__fbReady){
      const h=()=>{if(window.__fbReady)loadDiary();};
      window.addEventListener("fbReady",h);
      const poll=setInterval(()=>{if(window.__fbReady){loadDiary();clearInterval(poll);}},500);
      return()=>{window.removeEventListener("fbReady",h);clearInterval(poll);};
    } else loadDiary();
  },[]);

  function loadDiary(){
    const{collection,onSnapshot,query,orderBy}=window.__fb;
    const q=query(collection(window.__db,"diary"),orderBy("createdAt","desc"));
    onSnapshot(q,snap=>{
      setEntries(snap.docs.map(d=>({...d.data(),fireId:d.id})));
      setLoading(false);
    },()=>setLoading(false));
  }

  function openWrite(date=null,existing=null){
    if(existing){
      setEditEntry(existing);
      setFormDate(existing.date);
      setFormGoals(existing.goals&&existing.goals.length>0?existing.goals:[{text:"",done:false}]);
      setFormMemo(existing.memo||"");
    } else {
      setEditEntry(null);
      const d=date||today;
      setFormDate(d);
      setFormGoals([{text:"",done:false}]);
      setFormMemo("");
    }
    setView("write");
  }

  async function handleSave(){
    if(formGoals.every(g=>!g.text.trim())&&!formMemo.trim())return alert("목표나 메모를 입력해주세요!");
    setSaving(true);
    const entry={
      date:formDate,
      goals:formGoals.filter(g=>g.text.trim()),
      memo:formMemo,
      createdAt:editEntry?editEntry.createdAt:Date.now(),
      updatedAt:Date.now(),
    };
    if(editEntry?.fireId)entry.fireId=editEntry.fireId;
    await saveDiaryEntry(entry);
    setSaving(false);
    setView("list");
  }

  async function handleDelete(e){
    if(!window.confirm("이 기록을 삭제할까요?"))return;
    await deleteDiaryEntry(e.fireId);
    setView("list");
  }

  // 달력용 날짜 파싱
  function parseDate(str){
    // "2025. 06. 17" 또는 "2025-06-17" 형태 모두 처리
    if(!str)return null;
    const m=str.match(/(\d{4})[.\-\s]+(\d{1,2})[.\-\s]+(\d{1,2})/);
    if(!m)return null;
    return new Date(parseInt(m[1]),parseInt(m[2])-1,parseInt(m[3]));
  }

  // 달력
  function CalView(){
    const{y,m}=calMonth;
    const firstDay=new Date(y,m,1).getDay();
    const daysInMonth=new Date(y,m+1,0).getDate();
    const cells=[];
    for(let i=0;i<firstDay;i++)cells.push(null);
    for(let d=1;d<=daysInMonth;d++)cells.push(d);
    const entryMap={};
    entries.forEach(e=>{
      const pd=parseDate(e.date);
      if(pd&&pd.getFullYear()===y&&pd.getMonth()===m){
        const day=pd.getDate();
        if(!entryMap[day])entryMap[day]=[];
        entryMap[day].push(e);
      }
    });
    const todayD=new Date();
    return(
      <div>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
          <button onClick={()=>setCalMonth(p=>{const nm=p.m-1<0?{y:p.y-1,m:11}:{y:p.y,m:p.m-1};return nm;})} style={{border:"none",background:"none",fontSize:22,cursor:"pointer",color:C.a2,padding:"4px 8px"}}>‹</button>
          <span style={{fontWeight:800,fontSize:16,color:C.tx}}>{y}년 {m+1}월</span>
          <button onClick={()=>setCalMonth(p=>{const nm=p.m+1>11?{y:p.y+1,m:0}:{y:p.y,m:p.m+1};return nm;})} style={{border:"none",background:"none",fontSize:22,cursor:"pointer",color:C.a2,padding:"4px 8px"}}>›</button>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3,marginBottom:4}}>
          {["일","월","화","수","목","금","토"].map(d=><div key={d} style={{textAlign:"center",fontSize:10,fontWeight:700,color:C.sub,padding:"4px 0"}}>{d}</div>)}
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3}}>
          {cells.map((d,i)=>{
            if(!d)return<div key={"e"+i}/>;
            const isToday=todayD.getFullYear()===y&&todayD.getMonth()===m&&todayD.getDate()===d;
            const dayEntries=entryMap[d]||[];
            const hasEntry=dayEntries.length>0;
            const allDone=hasEntry&&dayEntries.every(e=>e.goals&&e.goals.length>0&&e.goals.every(g=>g.done));
            const partial=hasEntry&&!allDone&&dayEntries.some(e=>e.goals&&e.goals.some(g=>g.done));
            return(
              <div key={d} onClick={()=>{
                if(hasEntry){setSelDate({y,m,d,entries:dayEntries});setView("detail");}
                else{const ds=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;openWrite(ds);}
              }} style={{
                aspectRatio:"1",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
                borderRadius:10,cursor:"pointer",
                background:isToday?C.a1:hasEntry?"#f0eaf8":"#fff",
                border:`1.5px solid ${isToday?C.a1:hasEntry?C.a1:C.br}`,
                position:"relative",gap:2,
              }}>
                <span style={{fontSize:13,fontWeight:isToday?900:hasEntry?700:400,color:isToday?"#fff":hasEntry?C.a2:C.tx}}>{d}</span>
                {hasEntry&&<span style={{fontSize:9,color:isToday?"rgba(255,255,255,0.9)":allDone?"#5ab98a":partial?"#d4a04a":C.sub}}>{allDone?"✓":partial?"◐":"●"}</span>}
              </div>
            );
          })}
        </div>
        <div style={{display:"flex",gap:10,marginTop:12,fontSize:11,color:C.sub,justifyContent:"center"}}>
          <span>● 기록있음</span><span style={{color:"#d4a04a"}}>◐ 일부달성</span><span style={{color:"#5ab98a"}}>✓ 목표달성</span>
        </div>
      </div>
    );
  }

  // 기록 카드
  function DiaryCard({e,onClick}){
    const totalGoals=e.goals?.length||0;
    const doneGoals=e.goals?.filter(g=>g.done).length||0;
    const pct=totalGoals>0?Math.round(doneGoals/totalGoals*100):null;
    const pctColor=pct===null?"#ccc":pct===100?"#5ab98a":pct>=50?"#d4a04a":"#e07a7a";
    return(
      <div onClick={onClick} style={{background:C.card,borderRadius:16,padding:14,boxShadow:"0 2px 12px rgba(155,127,212,.08)",border:`1.5px solid ${C.br}`,cursor:"pointer",marginBottom:10}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <span style={{fontWeight:800,fontSize:14,color:C.tx}}>{e.date}</span>
          {pct!==null&&<span style={{fontSize:12,fontWeight:700,color:pctColor,background:pctColor+"18",borderRadius:20,padding:"2px 10px"}}>{pct===100?"🎉 ":""}{pct}% 달성</span>}
        </div>
        {e.goals&&e.goals.length>0&&<div style={{marginBottom:e.memo?8:0}}>
          {e.goals.slice(0,3).map((g,i)=>(
            <div key={i} style={{display:"flex",alignItems:"center",gap:6,marginBottom:3}}>
              <span style={{fontSize:13,color:g.done?"#5ab98a":"#ccc"}}>{g.done?"✅":"⬜"}</span>
              <span style={{fontSize:12,color:g.done?C.sub:C.tx,textDecoration:g.done?"line-through":"none",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{g.text}</span>
            </div>
          ))}
          {e.goals.length>3&&<span style={{fontSize:11,color:C.sub}}>+{e.goals.length-3}개 더</span>}
        </div>}
        {e.memo&&<div style={{fontSize:11,color:C.sub,background:C.hd,borderRadius:8,padding:"5px 9px",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>📝 {e.memo}</div>}
      </div>
    );
  }

  // 상세 보기
  if(view==="detail"&&selDate){
    const e=selDate.entries[0];
    const totalGoals=e.goals?.length||0;
    const doneGoals=e.goals?.filter(g=>g.done).length||0;
    const pct=totalGoals>0?Math.round(doneGoals/totalGoals*100):null;
    const pctColor=pct===null?"#ccc":pct===100?"#5ab98a":pct>=50?"#d4a04a":"#e07a7a";
    return(
      <div style={{paddingBottom:30}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
          <button onClick={()=>setView("list")} style={{border:"none",background:"none",fontSize:22,cursor:"pointer",color:C.a2}}>←</button>
          <span style={{fontWeight:800,fontSize:16,color:C.tx}}>{e.date}</span>
        </div>
        {pct!==null&&<div style={{textAlign:"center",marginBottom:16}}>
          <div style={{display:"inline-flex",alignItems:"center",gap:8,background:pctColor+"15",borderRadius:30,padding:"8px 20px",border:`1.5px solid ${pctColor}44`}}>
            <span style={{fontSize:22,fontWeight:900,color:pctColor}}>{pct}%</span>
            <span style={{fontSize:13,color:pctColor,fontWeight:700}}>{pct===100?"목표 달성! 🎉":pct>=50?"절반 이상 달성":"조금 더 힘내봐요 💪"}</span>
          </div>
        </div>}
        {e.goals&&e.goals.length>0&&<div style={{background:C.card,borderRadius:16,padding:16,marginBottom:12,boxShadow:"0 2px 12px rgba(155,127,212,.08)",border:`1.5px solid ${C.br}`}}>
          <div style={{fontWeight:700,fontSize:13,color:C.sub,marginBottom:10}}>🎯 오늘의 목표</div>
          {e.goals.map((g,i)=>(
            <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 0",borderBottom:i<e.goals.length-1?`1px solid ${C.br}`:"none"}}>
              <span style={{fontSize:18,color:g.done?"#5ab98a":"#ddd"}}>{g.done?"✅":"⬜"}</span>
              <span style={{fontSize:14,color:g.done?C.sub:C.tx,textDecoration:g.done?"line-through":"none",flex:1}}>{g.text}</span>
            </div>
          ))}
        </div>}
        {e.memo&&<div style={{background:C.card,borderRadius:16,padding:16,marginBottom:16,boxShadow:"0 2px 12px rgba(155,127,212,.08)",border:`1.5px solid ${C.br}`}}>
          <div style={{fontWeight:700,fontSize:13,color:C.sub,marginBottom:8}}>📝 메모</div>
          <div style={{fontSize:14,color:C.tx,lineHeight:1.7,whiteSpace:"pre-wrap"}}>{e.memo}</div>
        </div>}
        <div style={{display:"flex",gap:8}}>
          <button onClick={()=>openWrite(null,e)} style={{flex:1,borderRadius:12,border:`1.5px solid ${C.a1}`,background:"#fff",color:C.a2,padding:"11px 0",fontWeight:700,fontSize:14,cursor:"pointer"}}>✏️ 수정</button>
          <button onClick={()=>handleDelete(e)} style={{flex:1,borderRadius:12,border:`1.5px solid #e07a7a`,background:"#fff",color:"#e07a7a",padding:"11px 0",fontWeight:700,fontSize:14,cursor:"pointer"}}>🗑️ 삭제</button>
        </div>
      </div>
    );
  }

  // 작성/수정 폼
  if(view==="write"){
    return(
      <div style={{background:C.card,borderRadius:22,padding:20,boxShadow:"0 6px 32px rgba(155,127,212,.12)"}}>
        <div style={{fontWeight:800,fontSize:17,marginBottom:18,color:C.tx}}>{editEntry?"✏️ 기록 수정":"📖 공부 기록 작성"}</div>
        <div style={{marginBottom:14}}>
          <div style={{fontSize:12,fontWeight:700,color:C.sub,marginBottom:5}}>날짜</div>
          <input type="date" value={formDate.includes("-")&&formDate.length===10?formDate:""} onChange={e=>setFormDate(e.target.value)}
            style={{width:"100%",borderRadius:10,border:`1.5px solid ${C.br}`,padding:"9px 12px",fontSize:13,color:C.tx}}/>
        </div>
        <div style={{marginBottom:14}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <span style={{fontSize:12,fontWeight:700,color:C.sub}}>🎯 오늘의 목표</span>
            <button onClick={()=>setFormGoals(p=>[...p,{text:"",done:false}])} style={{border:"none",background:C.hd,color:C.a2,borderRadius:8,padding:"3px 10px",fontSize:12,fontWeight:700,cursor:"pointer"}}>+ 추가</button>
          </div>
          {formGoals.map((g,i)=>(
            <div key={i} style={{display:"flex",alignItems:"center",gap:7,marginBottom:7}}>
              <button onClick={()=>setFormGoals(p=>p.map((x,j)=>j===i?{...x,done:!x.done}:x))}
                style={{border:"none",background:"none",fontSize:20,cursor:"pointer",padding:0,flexShrink:0,color:g.done?"#5ab98a":"#ddd"}}>{g.done?"✅":"⬜"}</button>
              <input value={g.text} onChange={e=>setFormGoals(p=>p.map((x,j)=>j===i?{...x,text:e.target.value}:x))}
                placeholder={`목표 ${i+1}`}
                style={{flex:1,borderRadius:10,border:`1.5px solid ${C.br}`,padding:"8px 11px",fontSize:13,color:C.tx}}/>
              {formGoals.length>1&&<button onClick={()=>setFormGoals(p=>p.filter((_,j)=>j!==i))}
                style={{border:"none",background:"none",fontSize:18,cursor:"pointer",color:"#ccc",padding:0,flexShrink:0}}>✕</button>}
            </div>
          ))}
        </div>
        <div style={{marginBottom:20}}>
          <div style={{fontSize:12,fontWeight:700,color:C.sub,marginBottom:5}}>📝 자유 메모</div>
          <textarea value={formMemo} onChange={e=>setFormMemo(e.target.value)}
            placeholder="오늘 공부 어땠어? 어디가 어려웠는지, 느낀 점 등 자유롭게!"
            style={{width:"100%",borderRadius:10,border:`1.5px solid ${C.br}`,padding:"10px 12px",fontSize:13,color:C.tx,minHeight:90,resize:"vertical"}}/>
        </div>
        <div style={{display:"flex",gap:10}}>
          <button onClick={()=>setView("list")} style={{flex:1,borderRadius:12,border:`1.5px solid ${C.br}`,background:"#fff",padding:"11px 0",fontWeight:700,fontSize:14,cursor:"pointer",color:C.sub}}>취소</button>
          <button onClick={handleSave} disabled={saving} style={{flex:2,borderRadius:12,border:"none",background:`linear-gradient(135deg,${C.a1},${C.a2})`,color:"#fff",padding:"11px 0",fontWeight:800,fontSize:15,cursor:"pointer",opacity:saving?0.7:1}}>{saving?"저장 중...":"저장하기 🌱"}</button>
        </div>
      </div>
    );
  }

  // 메인 (달력 + 리스트)
  if(loading)return<div style={{textAlign:"center",padding:"40px 0",color:C.sub,fontSize:14}}>불러오는 중... 🌱</div>;

  const streakDays=(()=>{
    const sorted=[...new Set(entries.map(e=>{const d=parseDate(e.date);return d?d.toDateString():null;}).filter(Boolean))].sort((a,b)=>new Date(b)-new Date(a));
    if(!sorted.length)return 0;
    let count=0;const today=new Date();today.setHours(0,0,0,0);
    let cur=new Date(today);
    for(const ds of sorted){const d=new Date(ds);d.setHours(0,0,0,0);if(d.getTime()===cur.getTime()){count++;cur.setDate(cur.getDate()-1);}else if(d<cur)break;}
    return count;
  })();

  return(
    <div style={{paddingBottom:30}}>
      <div style={{display:"flex",gap:7,marginBottom:14}}>
        {[{label:"총 기록",val:entries.length,color:C.a3},{label:"연속일수",val:streakDays+"일",color:"#e07a7a"},{label:"이번달",val:entries.filter(e=>{const d=parseDate(e.date);const n=new Date();return d&&d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth();}).length,color:"#d4a04a"},{label:"목표달성",val:entries.filter(e=>e.goals&&e.goals.length>0&&e.goals.every(g=>g.done)).length,color:"#5ab98a"}].map(s=>(
          <div key={s.label} style={{textAlign:"center",background:"rgba(255,255,255,0.85)",borderRadius:10,padding:"7px 4px",flex:1,boxShadow:"0 1px 6px rgba(155,127,212,.08)"}}>
            <div style={{fontSize:15,fontWeight:900,color:s.color}}>{s.val}</div>
            <div style={{fontSize:9,color:"#2d1f4a"}}>{s.label}</div>
          </div>
        ))}
      </div>

      <div style={{background:C.card,borderRadius:18,padding:16,marginBottom:16,boxShadow:"0 2px 12px rgba(155,127,212,.08)",border:`1.5px solid ${C.br}`}}>
        <CalView/>
      </div>

      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <span style={{fontWeight:700,fontSize:14,color:C.tx}}>📋 전체 기록 ({entries.length})</span>
      </div>
      {entries.length===0
        ?<div style={{textAlign:"center",padding:"40px 0"}}><div style={{fontSize:40}}>📖</div><div style={{marginTop:10,fontSize:14,color:"#bbb"}}>아직 기록이 없어요</div><div style={{fontSize:12,marginTop:4,color:"#ccc"}}>달력에서 날짜를 눌러 기록해보세요!</div></div>
        :entries.map(e=><DiaryCard key={e.fireId||e.createdAt} e={e} onClick={()=>{setSelDate({entries:[e]});setView("detail");}}/>)
      }

      <div style={{position:"fixed",bottom:28,right:24}}>
        <button onClick={()=>openWrite()} style={{width:56,height:56,borderRadius:"50%",border:"none",background:`linear-gradient(135deg,${C.a1},${C.a2})`,color:"#fff",fontSize:26,fontWeight:900,cursor:"pointer",boxShadow:"0 6px 22px rgba(155,127,212,.4)",display:"flex",alignItems:"center",justifyContent:"center"}}>+</button>
      </div>
    </div>
  );
}

// ── 시험 기록 ────────────────────────────────────────────────
function ExamTracker({curriculum,gradeOrder}){
  const[records,setRecords]=useState([]);
  const[loading,setLoading]=useState(true);
  const[fbReady,setFbReady]=useState(!!window.__fbReady);
  const[showAdd,setShowAdd]=useState(false);
  const[editTarget,setEditTarget]=useState(null); // 수정 중인 record
  const[chartType,setChartType]=useState("both"); // "sun","adv","both"
  const[viewMode,setViewMode]=useState("table"); // "table","chart"

  // form state
  const[fDate,setFDate]=useState(()=>new Date().toISOString().slice(0,10));
  const[fLabel,setFLabel]=useState("");
  const[fSunMy,setFSunMy]=useState("");
  const[fSunTop,setFSunTop]=useState("");
  const[fSunAvg,setFSunAvg]=useState("");
  const[fAdvMy,setFAdvMy]=useState("");
  const[fAdvTop,setFAdvTop]=useState("");
  const[fAdvAvg,setFAdvAvg]=useState("");
  const[fSunRank,setFSunRank]=useState("");
  const[fSunTotal,setFSunTotal]=useState("");
  const[fAdvRank,setFAdvRank]=useState("");
  const[fAdvTotal,setFAdvTotal]=useState("");
  const[saving,setSaving]=useState(false);
  const[delId,setDelId]=useState(null);
  // 학년/단원 드랍다운 state (선행/심화 각각)
  const[fSunGrade,setFSunGrade]=useState("");
  const[fSunBig,setFSunBig]=useState("");
  const[fSunMid,setFSunMid]=useState("");
  const[fAdvGrade,setFAdvGrade]=useState("");
  const[fAdvBig,setFAdvBig]=useState("");
  const[fAdvMid,setFAdvMid]=useState("");

  useEffect(()=>{
    if(!fbReady){
      const h=()=>setFbReady(true);
      window.addEventListener("fbReady",h);
      return()=>window.removeEventListener("fbReady",h);
    }
  },[fbReady]);

  useEffect(()=>{
    if(!fbReady)return;
    const{collection,onSnapshot,query,orderBy}=window.__fb;
    const q=query(collection(window.__db,"exams"),orderBy("createdAt","asc"));
    const unsub=onSnapshot(q,snap=>{
      setRecords(snap.docs.map(d=>({...d.data(),fireId:d.id})));
      setLoading(false);
    },()=>setLoading(false));
    return unsub;
  },[fbReady]);

  const resetForm=()=>{
    setFDate(new Date().toISOString().slice(0,10));
    setFLabel("");setFSunMy("");setFSunTop("");setFSunAvg("");setFSunRank("");setFSunTotal("");
    setFAdvMy("");setFAdvTop("");setFAdvAvg("");setFAdvRank("");setFAdvTotal("");
    setFSunGrade("");setFSunBig("");setFSunMid("");
    setFAdvGrade("");setFAdvBig("");setFAdvMid("");
  };

  const openEdit=(r)=>{
    setEditTarget(r);
    setFDate(r.date||new Date().toISOString().slice(0,10));
    setFLabel(r.label||"");
    setFSunMy(r.sun?.my!=null?String(r.sun.my):"");
    setFSunTop(r.sun?.top!=null?String(r.sun.top):"");
    setFSunAvg(r.sun?.avg!=null?String(r.sun.avg):"");
    setFSunRank(r.sun?.rank!=null?String(r.sun.rank):"");
    setFSunTotal(r.sun?.total!=null?String(r.sun.total):"");
    setFAdvMy(r.adv?.my!=null?String(r.adv.my):"");
    setFAdvTop(r.adv?.top!=null?String(r.adv.top):"");
    setFAdvAvg(r.adv?.avg!=null?String(r.adv.avg):"");
    setFAdvRank(r.adv?.rank!=null?String(r.adv.rank):"");
    setFAdvTotal(r.adv?.total!=null?String(r.adv.total):"");
    setFSunGrade(r.sun?.grade||"");
    setFSunBig(r.sun?.bigChapter||"");
    setFSunMid(r.sun?.midChapter||"");
    setFAdvGrade(r.adv?.grade||"");
    setFAdvBig(r.adv?.bigChapter||"");
    setFAdvMid(r.adv?.midChapter||"");
    setShowAdd(true);
  };

  const handleSave=async()=>{
    if(!fDate)return alert("날짜를 입력해주세요");
    if(!fSunMy&&!fAdvMy)return alert("점수를 하나 이상 입력해주세요");
    setSaving(true);
    const rec={
      date:fDate,
      label:fLabel,
      sun:{my:fSunMy?Number(fSunMy):null,top:fSunTop?Number(fSunTop):null,avg:fSunAvg?Number(fSunAvg):null,rank:fSunRank?Number(fSunRank):null,total:fSunTotal?Number(fSunTotal):null,grade:fSunGrade,bigChapter:fSunBig,midChapter:fSunMid},
      adv:{my:fAdvMy?Number(fAdvMy):null,top:fAdvTop?Number(fAdvTop):null,avg:fAdvAvg?Number(fAdvAvg):null,rank:fAdvRank?Number(fAdvRank):null,total:fAdvTotal?Number(fAdvTotal):null,grade:fAdvGrade,bigChapter:fAdvBig,midChapter:fAdvMid},
    };
    try{
      if(editTarget){
        const{doc,updateDoc}=window.__fb;
        await updateDoc(doc(window.__db,"exams",editTarget.fireId),rec);
      } else {
        const{collection,addDoc}=window.__fb;
        await addDoc(collection(window.__db,"exams"),{...rec,createdAt:Date.now()});
      }
      setShowAdd(false);setEditTarget(null);resetForm();
    }catch(e){alert("저장 실패: "+e.message);}
    setSaving(false);
  };

  const handleDel=async(fireId)=>{
    if(!window.confirm("삭제할까요?"))return;
    try{const{doc,deleteDoc}=window.__fb;await deleteDoc(doc(window.__db,"exams",fireId));}catch(e){alert("삭제 실패");}
  };

  const inp={width:"100%",borderRadius:10,border:`1.5px solid ${C.br}`,padding:"9px 12px",fontSize:14,background:"#fff",color:C.tx,outline:"none"};
  const numInp={...inp,width:"100%",textAlign:"center"};

  // 석차 추이 그래프 (상위 % 기준, y축 역전)
  function RankChart({data}){
    const pts=data.filter(r=>{
      const sr=r.sun?.rank,st=r.sun?.total,ar=r.adv?.rank,at=r.adv?.total;
      return (sr!=null&&st!=null&&st>0)||(ar!=null&&at!=null&&at>0);
    });
    if(pts.length<1)return(
      <div style={{textAlign:"center",padding:"30px 0",color:C.sub,fontSize:13}}>
        석차를 입력한 기록이 없어요 🌱<br/>
        <span style={{fontSize:11,color:"#ccc"}}>시험 기록에서 등수 + 정원을 입력해주세요</span>
      </div>
    );

    const W=340,H=210,PL=44,PR=20,PT=20,PB=52;
    const iW=W-PL-PR,iH=H-PT-PB;

    // 상위% 계산: 1등/20명 → (1-0/19)*100 = 100%, 마지막등 → 0에 가까워짐
    // pct = (total - rank) / (total - 1) * 100  (total=1이면 100)
    const toPct=(rank,total)=>total<=1?100:Math.round((total-rank)/(total-1)*100);

    const sunPts=pts.map((r,i)=>{
      const rank=r.sun?.rank,total=r.sun?.total;
      return[i,rank!=null&&total!=null&&total>0?toPct(rank,total):null,rank,total];
    });
    const advPts=pts.map((r,i)=>{
      const rank=r.adv?.rank,total=r.adv?.total;
      return[i,rank!=null&&total!=null&&total>0?toPct(rank,total):null,rank,total];
    });

    const allPct=[...sunPts,...advPts].map(p=>p[1]).filter(v=>v!=null);
    // y축: 항상 0~100 고정 (상위%)
    const minV=0,maxV=100,range=100;
    const n=pts.length;
    const xPos=(i)=>PL+(i/(Math.max(n-1,1)))*iW;
    const yPos=(pct)=>PT+iH-(pct/range)*iH;

    const makePath=(points)=>{
      const valid=points.filter(p=>p[1]!=null);
      if(valid.length<2)return"";
      return"M "+valid.map(p=>`${xPos(p[0]).toFixed(1)},${yPos(p[1]).toFixed(1)}`).join(" L ");
    };

    const yTicks=[0,25,50,75,100];
    // 색상
    const SUN_COLOR="#7c5cb8";
    const ADV_COLOR="#27a06a";

    return(
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",maxWidth:W,display:"block",overflow:"visible"}}>
        {/* 상위50% 기준선 */}
        <line x1={PL} x2={W-PR} y1={yPos(50)} y2={yPos(50)} stroke="#f0e8ff" strokeWidth="1.5" strokeDasharray="4,3"/>
        <text x={PL-5} y={yPos(50)+4} textAnchor="end" fontSize="8" fill="#c4aaee">50%</text>
        {/* grid */}
        {yTicks.filter(v=>v!==50).map(v=>(
          <g key={v}>
            <line x1={PL} x2={W-PR} y1={yPos(v)} y2={yPos(v)} stroke="#ece6f5" strokeWidth="1"/>
            <text x={PL-5} y={yPos(v)+4} textAnchor="end" fontSize="8.5" fill="#b0a0cc">{v}%</text>
          </g>
        ))}
        {/* x축 라벨 */}
        {pts.map((r,i)=>(
          <text key={i} x={xPos(i)} y={H-PB+14} textAnchor="middle" fontSize="8.5" fill="#9a8ab0">
            {r.label||r.date.slice(5).replace("-","/")}
          </text>
        ))}
        {/* 선행 선 */}
        {makePath(sunPts)&&<path d={makePath(sunPts)} fill="none" stroke={SUN_COLOR} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round"/>}
        {/* 심화 선 */}
        {makePath(advPts)&&<path d={makePath(advPts)} fill="none" stroke={ADV_COLOR} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round"/>}
        {/* 선행 점 + 라벨 */}
        {sunPts.map((p,i)=>p[1]!=null&&(
          <g key={"s"+i}>
            <circle cx={xPos(p[0])} cy={yPos(p[1])} r="4.5" fill={SUN_COLOR} stroke="#fff" strokeWidth="1.5"/>
            <text x={xPos(p[0])} y={yPos(p[1])-9} textAnchor="middle" fontSize="8.5" fontWeight="800" fill={SUN_COLOR}>
              {p[2]}등/{p[3]}명
            </text>
          </g>
        ))}
        {/* 심화 점 + 라벨 */}
        {advPts.map((p,i)=>p[1]!=null&&(
          <g key={"a"+i}>
            <circle cx={xPos(p[0])} cy={yPos(p[1])} r="4.5" fill={ADV_COLOR} stroke="#fff" strokeWidth="1.5"/>
            <text x={xPos(p[0])} y={yPos(p[1])+18} textAnchor="middle" fontSize="8.5" fontWeight="800" fill={ADV_COLOR}>
              {p[2]}등/{p[3]}명
            </text>
          </g>
        ))}
        {/* 범례 */}
        <g transform={`translate(${PL},${H-14})`}>
          <line x1="0" x2="14" y1="5" y2="5" stroke={SUN_COLOR} strokeWidth="2.5"/>
          <circle cx="7" cy="5" r="3" fill={SUN_COLOR} stroke="#fff" strokeWidth="1"/>
          <text x="18" y="8.5" fontSize="9" fontWeight="700" fill={SUN_COLOR}>📘 선행</text>
        </g>
        <g transform={`translate(${PL+iW/2},${H-14})`}>
          <line x1="0" x2="14" y1="5" y2="5" stroke={ADV_COLOR} strokeWidth="2.5"/>
          <circle cx="7" cy="5" r="3" fill={ADV_COLOR} stroke="#fff" strokeWidth="1"/>
          <text x="18" y="8.5" fontSize="9" fontWeight="700" fill={ADV_COLOR}>📗 심화</text>
        </g>
      </svg>
    );
  }

    // SVG 꺾은선 그래프 - 선행/심화 각각 독립 표시
  function LineChart({data,part}){
    // part: "sun" | "adv"
    const filtered=data.filter(r=>r[part]&&r[part].my!=null);
    if(filtered.length<1)return<div style={{textAlign:"center",padding:"30px 0",color:C.sub,fontSize:13}}>데이터가 부족해요 🌱</div>;

    const W=340,H=210,PL=40,PR=20,PT=20,PB=52;
    const iW=W-PL-PR,iH=H-PT-PB;

    const allVals=[];
    filtered.forEach(r=>{
      [r[part].my,r[part].top,r[part].avg].forEach(v=>{if(v!=null)allVals.push(v);});
    });
    const minV=Math.max(0,Math.floor(Math.min(...allVals)/10)*10-10);
    const maxV=Math.min(100,Math.ceil(Math.max(...allVals)/10)*10+5);
    const range=maxV-minV||1;
    const xPos=(i,total)=>PL+(i/(Math.max(total-1,1)))*iW;
    const yPos=(v)=>PT+iH-(((v-minV)/range)*iH);
    const makePath=(pts)=>{
      const valid=pts.filter(p=>p[1]!=null);
      if(valid.length<2)return"";
      return"M "+valid.map(p=>`${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" L ");
    };
    const n=filtered.length;

    // 색상 — 선행(보라계), 심화(초록계) 각각 내/최고/평균 3색
    const palette=part==="sun"
      ?{my:"#7c5cb8",top:"#e05fa0",avg:"#f0a030"}
      :{my:"#27a06a",top:"#e05fa0",avg:"#f0a030"};

    const myPts  =filtered.map((r,i)=>[xPos(i,n),r[part].my !=null?yPos(r[part].my ):null]);
    const topPts =filtered.map((r,i)=>[xPos(i,n),r[part].top!=null?yPos(r[part].top):null]);
    const avgPts =filtered.map((r,i)=>[xPos(i,n),r[part].avg!=null?yPos(r[part].avg):null]);

    const LINES=[
      {pts:myPts, color:palette.my, label:"내 점수", dash:"",    w:3},
      {pts:topPts,color:palette.top,label:"최고점",  dash:"6,3", w:1.8},
      {pts:avgPts,color:palette.avg,label:"평균",    dash:"2,4", w:1.8},
    ];

    const yTicks=[minV,minV+Math.round(range/4),minV+Math.round(range/2),minV+Math.round(range*3/4),maxV]
      .filter((v,i,a)=>a.indexOf(v)===i);

    return(
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",maxWidth:W,display:"block",overflow:"visible"}}>
        {/* grid */}
        {yTicks.map(v=>(
          <g key={v}>
            <line x1={PL} x2={W-PR} y1={yPos(v)} y2={yPos(v)} stroke="#ece6f5" strokeWidth="1"/>
            <text x={PL-5} y={yPos(v)+4} textAnchor="end" fontSize="9" fill="#b0a0cc">{v}</text>
          </g>
        ))}
        {/* x축 */}
        {filtered.map((r,i)=>(
          <text key={i} x={xPos(i,n)} y={H-PB+14} textAnchor="middle" fontSize="8.5" fill="#9a8ab0">
            {r.label||r.date.slice(5).replace("-","/")}
          </text>
        ))}
        {/* 선 + 점 */}
        {LINES.map((line,li)=>{
          const path=makePath(line.pts);
          return(
            <g key={li}>
              {path&&<path d={path} fill="none" stroke={line.color} strokeWidth={line.w} strokeDasharray={line.dash} strokeLinejoin="round" strokeLinecap="round"/>}
              {line.pts.map((p,pi)=>p[1]!=null&&(
                <circle key={pi} cx={p[0]} cy={p[1]} r={line.w>2?4:2.5} fill={line.color} stroke="#fff" strokeWidth="1.5"/>
              ))}
            </g>
          );
        })}
        {/* 내 점수 수치 라벨 */}
        {myPts.map((p,i)=>p[1]!=null&&(
          <text key={"mv"+i} x={p[0]} y={p[1]-8} textAnchor="middle" fontSize="9.5" fontWeight="800" fill={palette.my}>{filtered[i][part].my}</text>
        ))}
        {/* 범례 */}
        {LINES.map((line,li)=>(
          <g key={"leg"+li} transform={`translate(${PL+(li*(iW/3))},${H-16})`}>
            <line x1="0" x2="16" y1="5" y2="5" stroke={line.color} strokeWidth={line.w} strokeDasharray={line.dash}/>
            <circle cx="8" cy="5" r="3" fill={line.color} stroke="#fff" strokeWidth="1"/>
            <text x="20" y="8.5" fontSize="9" fontWeight="700" fill={line.color}>{line.label}</text>
          </g>
        ))}
      </svg>
    );
  }

    // 점수 배지
  const ScoreBadge=({val,type})=>{
    if(val===null||val===undefined)return<span style={{color:"#ccc",fontSize:12}}>—</span>;
    const colors={my:{bg:"#f0eaf8",color:"#5e3f9a"},top:{bg:"#e8f7ef",color:"#3b8a60"},avg:{bg:"#fef6e4",color:"#b07a28"}};
    const c=colors[type]||colors.my;
    return<span style={{background:c.bg,color:c.color,borderRadius:8,padding:"3px 8px",fontSize:12,fontWeight:700}}>{val}점</span>;
  };

  const RankBadge=({rank,total})=>{
    if(rank===null||rank===undefined)return<span style={{color:"#ccc",fontSize:12}}>—</span>;
    const pct=total?Math.round((1-(rank-1)/total)*100):null;
    const color=rank===1?"#c05090":rank<=3?"#9b5cb8":"#5e3f9a";
    const bg=rank===1?"#fce8f3":rank<=3?"#f0e8fc":"#ede5f8";
    return(
      <span style={{background:bg,color,borderRadius:8,padding:"3px 7px",fontSize:11,fontWeight:800,display:"inline-flex",alignItems:"center",gap:3}}>
        {rank===1&&<span style={{fontSize:12}}>🥇</span>}
        {rank===2&&<span style={{fontSize:12}}>🥈</span>}
        {rank===3&&<span style={{fontSize:12}}>🥉</span>}
        <span>{rank}등{total?"/"+total+"명":""}</span>
        {pct!==null&&<span style={{fontSize:9,fontWeight:600,opacity:0.75}}>({pct}%)</span>}
      </span>
    );
  };

  // 부분 통계
  const stats=(part)=>{
    const myArr=records.map(r=>r[part]?.my).filter(v=>v!==null&&v!==undefined);
    if(!myArr.length)return null;
    const avg=Math.round(myArr.reduce((a,b)=>a+b,0)/myArr.length);
    const best=Math.max(...myArr);
    const latest=myArr[myArr.length-1];
    return{avg,best,latest,cnt:myArr.length};
  };
  const sunStats=stats("sun");
  const advStats=stats("adv");

  return(
    <div>
      {/* 상단 요약 카드 */}
      {(sunStats||advStats)&&(
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:14}}>
          {sunStats&&(
            <div style={{background:"#f4eeff",borderRadius:14,padding:"12px 14px",border:"1.5px solid #ddd0f0"}}>
              <div style={{fontSize:11,fontWeight:700,color:C.a2,marginBottom:6}}>📘 선행 내 평균</div>
              <div style={{fontSize:24,fontWeight:900,color:C.a3}}>{sunStats.avg}<span style={{fontSize:12,fontWeight:600,color:C.sub}}>점</span></div>
              <div style={{fontSize:10,color:C.sub,marginTop:3}}>최고 {sunStats.best}점 · 최근 {sunStats.latest}점</div>
            </div>
          )}
          {advStats&&(
            <div style={{background:"#e8f7ef",borderRadius:14,padding:"12px 14px",border:"1.5px solid #b4e5cb"}}>
              <div style={{fontSize:11,fontWeight:700,color:"#3b8a60",marginBottom:6}}>📗 심화 내 평균</div>
              <div style={{fontSize:24,fontWeight:900,color:"#2a6b47"}}>{advStats.avg}<span style={{fontSize:12,fontWeight:600,color:"#6aad8a"}}>점</span></div>
              <div style={{fontSize:10,color:"#6aad8a",marginTop:3}}>최고 {advStats.best}점 · 최근 {advStats.latest}점</div>
            </div>
          )}
        </div>
      )}

      {/* 뷰 전환 */}
      {records.length>0&&(
        <div style={{display:"flex",gap:6,marginBottom:12}}>
          <button onClick={()=>setViewMode("table")} style={{flex:1,borderRadius:10,border:`1.5px solid ${viewMode==="table"?C.a1:C.br}`,background:viewMode==="table"?C.hd:"#fff",color:viewMode==="table"?C.a2:C.sub,fontWeight:700,fontSize:12,padding:"7px 0",cursor:"pointer"}}>📋 표</button>
          <button onClick={()=>setViewMode("chart")} style={{flex:1,borderRadius:10,border:`1.5px solid ${viewMode==="chart"?C.a1:C.br}`,background:viewMode==="chart"?C.hd:"#fff",color:viewMode==="chart"?C.a2:C.sub,fontWeight:700,fontSize:12,padding:"7px 0",cursor:"pointer"}}>📈 그래프</button>
        </div>
      )}

      {/* 그래프 뷰 */}
      {viewMode==="chart"&&records.length>0&&(
        <div style={{display:"flex",flexDirection:"column",gap:12,marginBottom:14}}>
          {/* 📘 선행 그래프 */}
          <div style={{background:"#fff",borderRadius:16,padding:"16px 14px",border:"1.5px solid #ddd0f0",boxShadow:"0 2px 12px rgba(155,127,212,.07)"}}>
            <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:12}}>
              <span style={{fontSize:13,fontWeight:800,color:C.a2}}>📘 선행</span>
              <span style={{fontSize:10,color:C.sub,fontWeight:500}}>회차별 점수 추이</span>
            </div>
            <LineChart data={records} part="sun"/>
          </div>
          {/* 📗 심화 그래프 */}
          <div style={{background:"#fff",borderRadius:16,padding:"16px 14px",border:"1.5px solid #b4e5cb",boxShadow:"0 2px 12px rgba(90,185,138,.07)"}}>
            <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:12}}>
              <span style={{fontSize:13,fontWeight:800,color:"#27a06a"}}>📗 심화</span>
              <span style={{fontSize:10,color:"#6aad8a",fontWeight:500}}>회차별 점수 추이</span>
            </div>
            <LineChart data={records} part="adv"/>
          </div>
          {/* 🏅 석차 그래프 */}
          <div style={{background:"#fff",borderRadius:16,padding:"16px 14px",border:"1.5px solid #f0d8ee",boxShadow:"0 2px 12px rgba(192,80,144,.06)"}}>
            <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:4}}>
              <span style={{fontSize:13,fontWeight:800,color:"#c05090"}}>🏅 석차 추이</span>
              <span style={{fontSize:10,color:"#d088b8",fontWeight:500}}>상위 % 기준 · 선행/심화 통합</span>
            </div>

                    <div><div style={{fontSize:10,color:"#888",fontWeight:700,marginBottom:4,textAlign:"center"}}>👥 정원 (명)</div><input type="number" min="1" placeholder="—" value={fAdvTotal} onChange={e=>setFAdvTotal(e.target.value)} style={numInp}/></div>

function App(){
  const[cards,setCards]=useState([]);
  const[loading,setLoading]=useState(true);
  const[fbReady,setFbReady]=useState(!!window.__fbReady);
  const[curriculum,setCurriculum]=useState(DEFAULT_CURRICULUM);
  const[gradeOrder,setGradeOrder]=useState(DEFAULT_GRADE_ORDER);
  const[curriculumLoaded,setCurriculumLoaded]=useState(false);
  const[tab,setTab]=useState("note");
  const[view,setView]=useState("list");const[ac,setAc]=useState(null);const[ec,setEc]=useState(null);
  const[fT,setFT]=useState("all");const[fG,setFG]=useState("all");const[fB,setFB]=useState("all");
  const[fD,setFD]=useState("all");const[fBig,setFBig]=useState("all");const[fSub,setFSub]=useState("all");
  const[checked,setChecked]=useState(new Set());const[selectMode,setSelectMode]=useState(false);

  const saveAll=(cur,ord)=>{setCurriculum(cur);setGradeOrder(ord);saveCurriculum(cur,ord);};

  useEffect(()=>{
    // 모바일: 이미 준비됐으면 바로, 아니면 이벤트+폴링으로 대기
    if(window.__fbReady){setFbReady(true);return;}
    const h=()=>{if(window.__fbReady)setFbReady(true);};
    window.addEventListener("fbReady",h);
    const poll=setInterval(()=>{if(window.__fbReady){setFbReady(true);clearInterval(poll);}},500);
    return()=>{window.removeEventListener("fbReady",h);clearInterval(poll);};
  },[]);
  useEffect(()=>{
    if(!fbReady||curriculumLoaded)return;
    // Firebase에서 저장된 curriculum 불러오기 (덮어쓰지 않음!)
    loadCurriculum().then(result=>{
      if(result){setCurriculum(result.cur);setGradeOrder(result.order||Object.keys(result.cur));}
      setCurriculumLoaded(true);
    });
  },[fbReady,curriculumLoaded]);
  useEffect(()=>{
    if(!fbReady)return;
    const{collection,onSnapshot,query,orderBy}=window.__fb;
    const q=query(collection(window.__db,"cards"),orderBy("createdAt","desc"));
    const unsub=onSnapshot(q,snap=>{setCards(snap.docs.map(d=>({...d.data(),fireId:d.id})));setLoading(false);},()=>setLoading(false));
    return unsub;
  },[fbReady]);

  const add=()=>setView("list");
  const upd=(id,t,history)=>{setCards(p=>p.map(c=>c.id===id?{...c,mistakeType:t,reviewCount:(c.reviewCount||0)+1,lastReview:new Date().toLocaleDateString("ko-KR"),reviewHistory:history||(c.reviewHistory||[])}:c));setView("list");};
  const updCard=(updated)=>{setCards(p=>p.map(c=>c.id===updated.id?updated:c));setView("list");setEc(null);};
  const del=async(fireId,id)=>{
    if(!window.confirm("삭제할까요?"))return;
    try{const{doc,deleteDoc}=window.__fb;await deleteDoc(doc(window.__db,"cards",fireId));}catch(e){console.error(e);}
    setCards(p=>p.filter(c=>c.id!==id));
  };

  const fil=cards.filter(c=>{
    if(fT!=="all"&&c.mistakeType!==fT)return false;
    if(fG!=="all"&&c.grade!==fG)return false;
    if(fB!=="all"&&c.book!==fB)return false;
    if(fD!=="all"&&c.difficulty!==fD)return false;
    if(fBig!=="all"&&(c.grade+"__"+c.bigChapter)!==fBig)return false;
    if(fSub!=="all"&&c.subChapter!==fSub)return false;
    if(fT==="all"&&c.mistakeType==="solved")return false;
    return true;
  });
  const hiddenSolvedCount=cards.filter(c=>{
    if(c.mistakeType!=="solved")return false;
    if(fG!=="all"&&c.grade!==fG)return false;
    if(fB!=="all"&&c.book!==fB)return false;
    if(fD!=="all"&&c.difficulty!==fD)return false;
    if(fBig!=="all"&&(c.grade+"__"+c.bigChapter)!==fBig)return false;
    if(fSub!=="all"&&c.subChapter!==fSub)return false;
    return true;
  }).length;
  const toggleCheck=id=>setChecked(p=>{const n=new Set(p);n.has(id)?n.delete(id):n.add(id);return n;});
  const checkedCards=cards.filter(c=>checked.has(c.id));
  const toggleAll=()=>{
    if(fil.every(c=>checked.has(c.id)))setChecked(p=>{const n=new Set(p);fil.forEach(c=>n.delete(c.id));return n;});
    else setChecked(p=>{const n=new Set(p);fil.forEach(c=>n.add(c.id));return n;});
  };
  const allChecked=fil.length>0&&fil.every(c=>checked.has(c.id));

  if(view==="add")return<div style={{minHeight:"100vh",background:C.bg,padding:"24px 16px"}}><Add onAdd={add} onCancel={()=>setView("list")} curriculum={curriculum} gradeOrder={gradeOrder}/></div>;
  if(view==="edit"&&ec)return<div style={{minHeight:"100vh",background:C.bg,padding:"24px 16px"}}><Edit card={ec} onCancel={()=>{setView("list");setEc(null);}} onSave={updCard} curriculum={curriculum} gradeOrder={gradeOrder}/></div>;
  if(view==="flash"&&ac)return<div style={{minHeight:"100vh",background:C.bg,padding:"24px 16px"}}><Flash card={ac} onBack={()=>setView("list")} onUpdate={upd}/></div>;

  const TABS=[{id:"note",label:"📓 오답노트"},{id:"exam",label:"🏆 시험기록"},{id:"diary",label:"📖 공부일기"},{id:"progress",label:"📚 진도체크"},{id:"accuracy",label:"📊 정답률"},{id:"manage",label:"⚙️ 교재관리"}];

  return(
    <div style={{minHeight:"100vh",background:C.bg}}>
      <div style={{background:"linear-gradient(135deg,#e8dff5 0%,#d4c8ee 50%,#c8b8e8 100%)",padding:"20px 20px 0"}}>
        <div style={{maxWidth:480,margin:"0 auto"}}>
          <div style={{fontSize:11,letterSpacing:2,color:"#2d1f4a",marginBottom:2}}>수학천재 김서윤 🌱</div>
          <div style={{fontSize:20,fontWeight:900,color:C.tx,marginBottom:14}}>
            {tab==="note"?"오답노트":tab==="exam"?"시험 기록":tab==="diary"?"공부 일기":tab==="progress"?"진도 체크":tab==="accuracy"?"정답률 확인":"교재 관리"}
          </div>
          <div style={{display:"flex",overflowX:"auto",scrollbarWidth:"none",WebkitOverflowScrolling:"touch",gap:2}}>
            {TABS.map(t=>(
              <button key={t.id} onClick={()=>setTab(t.id)}
                style={{flexShrink:0,padding:"8px 10px",border:"none",background:tab===t.id?"#fff":"transparent",color:tab===t.id?C.a2:C.tx,fontWeight:tab===t.id?800:600,fontSize:11,cursor:"pointer",borderRadius:tab===t.id?"12px 12px 0 0":"0",opacity:tab===t.id?1:0.7,transition:"all 0.2s",lineHeight:1.3,textAlign:"center",whiteSpace:"nowrap"}}>
                {t.label}
              </button>
            ))}
          </div>
        </div>
      </div>

      <div style={{maxWidth:480,margin:"0 auto",padding:"14px 16px"}}>
        {tab==="note"&&<>
          <div style={{display:"flex",gap:7,marginBottom:14}}>
            {[{label:"전체",val:cards.length,color:C.a3},{label:"모름",val:cards.filter(c=>c.mistakeType==="wrong").length,color:"#e07a7a"},{label:"애매함",val:cards.filter(c=>c.mistakeType==="unsure").length,color:"#d4a04a"},{label:"계산실수",val:cards.filter(c=>c.mistakeType==="calc").length,color:"#9b7fd4"},{label:"완료",val:cards.filter(c=>c.mistakeType==="solved").length,color:"#5ab98a"}].map(s=>(
              <div key={s.label} style={{textAlign:"center",background:"rgba(255,255,255,0.85)",borderRadius:10,padding:"7px 4px",flex:1,boxShadow:"0 1px 6px rgba(155,127,212,.08)"}}>
                <div style={{fontSize:16,fontWeight:900,color:s.color}}>{s.val}</div>
                <div style={{fontSize:9,color:"#2d1f4a"}}>{s.label}</div>
              </div>
            ))}
          </div>
          {loading&&<div style={{textAlign:"center",padding:"40px 0",color:C.sub,fontSize:14}}>불러오는 중... 🌱</div>}
          {!loading&&<>
            {(hiddenSolvedCount>0||fT==="solved")&&<button onClick={()=>{if(fT==="solved"){setFT("all");setShowSolved(false);}else{setFT("solved");setShowSolved(true);}}} style={{width:"100%",marginBottom:12,borderRadius:10,border:`1.5px solid #5ab98a`,background:fT==="solved"?"#e6f7ef":"#fff",padding:"8px 14px",fontWeight:700,fontSize:13,cursor:"pointer",color:"#3b8a60",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
              <span>✅ 완료된 문제 {fT==="solved"?fil.length:hiddenSolvedCount}개</span>
              <span style={{fontSize:11}}>{fT==="solved"?"목록으로 ▲":"보기 ▼"}</span>
            </button>}
            <div style={{display:"flex",gap:6,marginBottom:8,flexWrap:"wrap"}}>
              <FilterDrop value={fG} options={[{val:"all",label:"학기 전체"},...gradeOrder.filter(g=>curriculum[g]).map(g=>({val:g,label:g}))]} onChange={v=>{setFG(v);setFBig("all");setFSub("all");}} placeholder="학기 전체"/>
              <FilterDrop value={fB} options={[{val:"all",label:"교재 전체"},...Array.from(new Set(gradeOrder.filter(g=>curriculum[g]&&(fG==="all"||g===fG)).flatMap(g=>curriculum[g].books||[]))).map(b=>({val:b,label:b}))]} onChange={setFB} placeholder="교재 전체"/>
              <FilterDrop value={fD} options={[{val:"all",label:"난이도 전체"},...DIF.map(d=>({val:d,label:d+"단계"}))]} onChange={setFD} placeholder="난이도 전체"/>
              <FilterDrop value={fT} options={[{val:"all",label:"유형 전체"},...MT.map(t=>({val:t.id,label:t.label}))]} onChange={setFT} placeholder="유형 전체"/>
            </div>
            <div style={{display:"flex",gap:6,marginBottom:10}}>
              <FilterDrop value={fBig} options={[{val:"all",label:"단원 전체"},...cards.filter(c=>fG==="all"||c.grade===fG).reduce((acc,c)=>{const key=c.grade+"__"+c.bigChapter;if(c.bigChapter&&!acc.find(x=>x.val===key))acc.push({val:key,label:c.grade+" · "+c.bigChapter});return acc;},[])]} onChange={v=>{setFBig(v);setFSub("all");}} placeholder="단원 전체"/>
              <FilterDrop value={fSub} options={[{val:"all",label:"소단원 전체"},...Array.from(new Set(cards.filter(c=>(fG==="all"||c.grade===fG)&&(fBig==="all"||(c.grade+"__"+c.bigChapter)===fBig)&&(fB==="all"||c.book===fB)&&c.subChapter).map(c=>c.subChapter))).map(s=>({val:s,label:s}))]} onChange={setFSub} placeholder="소단원 전체"/>
            </div>
            {fil.length>0&&<div style={{display:"flex",gap:8,marginBottom:12,alignItems:"center"}}>
              <button onClick={()=>{setSelectMode(s=>!s);setChecked(new Set());}} style={{borderRadius:10,border:`1.5px solid ${selectMode?C.a1:C.br}`,background:selectMode?C.hd:"#fff",padding:"7px 14px",fontWeight:700,fontSize:13,cursor:"pointer",color:selectMode?C.a2:C.sub,display:"flex",alignItems:"center",gap:5}}>
                <span style={{fontSize:15}}>{selectMode?"✓":"☐"}</span> 출력
              </button>
              {selectMode&&<button onClick={toggleAll} style={{borderRadius:10,border:`1.5px solid ${C.br}`,background:"#fff",padding:"7px 12px",fontWeight:600,fontSize:12,cursor:"pointer",color:C.sub}}>{allChecked?"전체 해제":"전체 선택"}</button>}
              {!selectMode&&<button onClick={()=>doPrint(fil)} style={{flex:1,borderRadius:10,border:`1.5px solid ${C.a2}`,background:"#fff",padding:"7px 14px",fontWeight:700,fontSize:13,cursor:"pointer",color:C.a3,display:"flex",alignItems:"center",justifyContent:"center",gap:5}}>{/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)?"🖨️ 전체 "+fil.length+"개 이미지저장":"🖨️ 전체 "+fil.length+"개 PDF저장"}</button>}
            </div>}
            {fil.length===0?<div style={{textAlign:"center",padding:"60px 0"}}><div style={{fontSize:40}}>🌱</div><div style={{marginTop:10,fontSize:14,color:"#bbb"}}>저장된 문제가 없어요</div><div style={{fontSize:12,marginTop:4,color:"#ccc"}}>아래 + 버튼으로 추가해보세요</div></div>
            :<div style={{display:"flex",flexDirection:"column",gap:11,paddingBottom:checked.size>0?80:0}}>
              {fil.map(card=>(
                <div key={card.id} onClick={selectMode?()=>toggleCheck(card.id):undefined}
                  style={{background:checked.has(card.id)?"#f0eaf8":C.card,borderRadius:16,padding:14,boxShadow:"0 2px 12px rgba(155,127,212,.08)",display:"flex",gap:12,alignItems:"flex-start",border:`1.5px solid ${checked.has(card.id)?C.a1:C.br}`,cursor:selectMode?"pointer":"default"}}>
                  {selectMode&&<div style={{width:22,height:22,borderRadius:6,border:`2px solid ${checked.has(card.id)?C.a1:C.br}`,background:checked.has(card.id)?C.a1:"#fff",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginTop:2}}>{checked.has(card.id)&&<span style={{color:"#fff",fontSize:13,fontWeight:900}}>✓</span>}</div>}
                  <img src={card.img} style={{width:78,height:78,objectFit:"cover",objectPosition:"left top",borderRadius:10,border:`1px solid ${C.br}`,flexShrink:0}}/>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:"flex",gap:4,flexWrap:"wrap",marginBottom:4}}>
                      <span style={{fontSize:10,fontWeight:700,color:"#5e3f9a",background:C.hd,borderRadius:6,padding:"1px 7px"}}>{card.grade}</span>
                      <span style={{fontSize:10,color:"#7c5cb8",background:"#ede5f8",borderRadius:6,padding:"1px 7px"}}>{card.book}</span>
                    </div>
                    <div style={{fontSize:10,color:"#888",marginBottom:3,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                      {[card.bigChapter,card.midChapter,card.subChapter].filter(Boolean).join(" › ")}
                    </div>
                    <div style={{display:"flex",gap:5,flexWrap:"wrap",alignItems:"center"}}><DB diff={card.difficulty}/><Tag type={card.mistakeType}/></div>
                    {card.memo&&<div style={{fontSize:11,color:C.sub,marginTop:4,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>📝 {card.memo}</div>}
                    <div style={{fontSize:10,color:"#ccc",marginTop:3}}>{card.date} · 복습 {card.reviewCount||0}회{card.lastReview?` · 최근 ${card.lastReview}`:""}</div>
                    {(card.reviewHistory&&card.reviewHistory.length>0)&&<div style={{display:"flex",gap:3,marginTop:5,flexWrap:"wrap"}}>
                      {card.reviewHistory.map((h,i)=>{const r=RH[h.result]||RH.wrong;return<span key={i} title={`복습${i+1} · ${h.date} · ${r.label}`} style={{display:"inline-flex",alignItems:"center",justifyContent:"center",width:18,height:18,borderRadius:"50%",background:r.bg,color:r.color,fontSize:9,fontWeight:900,border:`1px solid ${r.color}44`}}>{r.icon}</span>;})}
                    </div>}
                  </div>
                  {!selectMode&&<div style={{display:"flex",flexDirection:"column",gap:6,flexShrink:0}}>
                    <button onClick={()=>{setAc(card);setView("flash");}} style={{borderRadius:10,border:"none",background:`linear-gradient(135deg,${C.a1},${C.a2})`,color:"#fff",padding:"7px 12px",fontWeight:700,fontSize:12,cursor:"pointer"}}>풀기</button>
                    <button onClick={()=>{setEc(card);setView("edit");}} style={{borderRadius:10,border:`1.5px solid ${C.a1}`,background:"#fff",color:C.a2,padding:"6px 12px",fontWeight:700,fontSize:12,cursor:"pointer"}}>수정</button>
                    <button onClick={()=>del(card.fireId,card.id)} style={{borderRadius:10,border:`1px solid ${C.br}`,background:"#fff",color:"#c07030",padding:"6px 12px",fontWeight:700,fontSize:12,cursor:"pointer"}}>삭제</button>
                  </div>}
                </div>
              ))}
            </div>}
          </>}
        </>}

        {tab==="exam"&&<ExamTracker curriculum={curriculum} gradeOrder={gradeOrder}/>}
        {tab==="diary"&&<StudyDiary/>}
        {tab==="progress"&&<ProgressChecker cards={cards} curriculum={curriculum} gradeOrder={gradeOrder}/>}
        {tab==="accuracy"&&<AccuracyTracker curriculum={curriculum} gradeOrder={gradeOrder}/>}
        {tab==="manage"&&<CurriculumManager curriculum={curriculum} gradeOrder={gradeOrder} onSave={saveAll}/>}
      </div>

      {tab==="note"&&selectMode&&checked.size>0&&(
        <div style={{position:"fixed",bottom:0,left:0,right:0,background:"#fff",borderTop:`1.5px solid ${C.br}`,padding:"12px 20px",boxShadow:"0 -4px 20px rgba(0,0,0,0.10)",zIndex:100}}>
          <div style={{maxWidth:480,margin:"0 auto"}}>
            <button onClick={()=>doPrint(checkedCards)} style={{width:"100%",borderRadius:12,border:"none",background:`linear-gradient(135deg,${C.a1},${C.a2})`,color:"#fff",padding:"13px 0",fontWeight:800,fontSize:15,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
              {/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)?"🖨️ 선택한 "+checked.size+"개 이미지저장":"🖨️ 선택한 "+checked.size+"개 PDF저장"}
            </button>
          </div>
        </div>
      )}
      {tab==="note"&&<div style={{position:"fixed",bottom:28,right:24}}>
        <button onClick={()=>setView("add")} style={{width:56,height:56,borderRadius:"50%",border:"none",background:`linear-gradient(135deg,${C.a1},${C.a2})`,color:"#fff",fontSize:26,fontWeight:900,cursor:"pointer",boxShadow:"0 6px 22px rgba(155,127,212,.4)",display:"flex",alignItems:"center",justifyContent:"center"}}>+</button>
      </div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
